plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // PUSH-FIX (iter6): apply the Google Services plugin so the bundled
    // android/app/google-services.json is processed into FirebaseOptions
    // (values.xml). Without this, Firebase.initializeApp() throws
    // "Failed to load FirebaseOptions from resource" -> no FCM token -> no push.
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "app.jeeb.mobile"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "app.jeeb.mobile"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Sprint 1 Stream B (T-MOB-017): Google Maps SDK key injected into the
        // ${MAPS_API_KEY} manifest placeholder. Sourced from a Gradle property
        // (-PMAPS_API_KEY=… on the CLI, gradle.properties, or a CI secret);
        // falls back to a harmless placeholder so a keyless dev build still
        // assembles (the map tiles just won't load). NEVER commit a real key.
        manifestPlaceholders["MAPS_API_KEY"] = project.findProperty("MAPS_API_KEY") ?: "YOUR_MAPS_API_KEY_HERE"
    }

    // ─── Flavor Configuration ────────────────────────────────────────────────
    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Jeeb Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-stg"
            resValue "string", "app_name", "Jeeb Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Jeeb"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // TODO: replace with release keystore
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
}
