plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "app.jeeb.mobile"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "app.jeeb.mobile"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // ─── Flavor Configuration ────────────────────────────────────────────────
    // ONE app (one applicationId per environment). The Jeeber Dev Tool is NOT a
    // separate app — it is a SECOND LAUNCHER ICON on this same app (activity-alias
    // `.DevToolLauncher` in AndroidManifest), so it shares the app's process, data
    // and session (full access). The alias is gated by @bool/jeeb_devtool_enabled:
    // true in dev/staging, false in production → the icon + tool exist only in
    // test builds and are stripped from the shipped product.
    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Jeeb Dev"
            resValue "bool", "jeeb_devtool_enabled", "true"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-stg"
            resValue "string", "app_name", "Jeeb Staging"
            resValue "bool", "jeeb_devtool_enabled", "true"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Jeeb"
            resValue "bool", "jeeb_devtool_enabled", "false"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // TODO: replace with release keystore
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
}
