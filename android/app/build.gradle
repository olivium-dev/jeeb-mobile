plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "app.jeeb.mobile"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "app.jeeb.mobile"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // ─── Flavor Configuration ────────────────────────────────────────────────
    // Two orthogonal dimensions. "distribution" (listed first = higher priority
    // for resValue/appId merges) splits the real product from the Jeeber Dev Tool
    // — a SECOND installable app built from this same source tree. "environment"
    // is unchanged (dev/staging/production).
    //
    // Variant names are the concatenation, e.g. `appProduction`, `devtoolDev`.
    //   appProduction    -> app.jeeb.mobile              (the real product)
    //   devtoolProduction-> app.jeeb.mobile.devtool      (Jeeber Dev Tool)
    // NOTE: `--flavor dev` is now `--flavor appDev` (CI updated accordingly).
    flavorDimensions "distribution", "environment"

    productFlavors {
        // distribution dimension ------------------------------------------------
        app {
            dimension "distribution"
            // real product: no suffix, app_name comes from the environment flavor.
        }
        devtool {
            dimension "distribution"
            applicationIdSuffix ".devtool"
            versionNameSuffix "-devtool"
            // Higher-priority dimension, so this app_name wins over environment's.
            resValue "string", "app_name", "Jeeber Dev Tool"
        }

        // environment dimension -------------------------------------------------
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Jeeb Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-stg"
            resValue "string", "app_name", "Jeeb Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Jeeb"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // TODO: replace with release keystore
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
}
