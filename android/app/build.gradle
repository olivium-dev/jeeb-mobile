plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // PUSH-WIRING: apply the Google Services plugin (declared apply-false in
    // settings.gradle v4.4.2) so the bundled google-services.json is merged
    // into the per-flavor applicationId (app.jeeb.mobile.dev) and
    // Firebase.initializeApp() loads FirebaseOptions from the generated
    // resource instead of falling back to the Noop reporter.
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Release signing material — read from android/key.properties (gitignored; see
// android/.gitignore). Absent on machines without the release keystore, in
// which case the release build falls back to debug signing (below).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "app.jeeb.mobile"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "app.jeeb.mobile"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Android Maps SDK key injected via the ${MAPS_API_KEY} manifest
        // placeholder (see the google_maps_flutter note in pubspec.yaml and the
        // com.google.android.geo.API_KEY meta-data in AndroidManifest.xml).
        // Sourced from the gitignored android/local.properties so the key is
        // never committed. `+=` preserves Flutter's ${applicationName}
        // placeholder. Empty string when unprovisioned (keyless placeholder map).
        manifestPlaceholders += [MAPS_API_KEY: localProperties.getProperty('MAPS_API_KEY', '')]
    }

    // ─── Flavor Configuration ────────────────────────────────────────────────
    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Jeeb Dev"
            // Enables the Jeeber Dev Tool second-launcher activity-alias.
            resValue "bool", "jeeb_devtool_enabled", "true"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-stg"
            resValue "string", "app_name", "Jeeb Staging"
            resValue "bool", "jeeb_devtool_enabled", "true"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Jeeb"
            // Production hides the Dev Tool launcher icon (defence-in-depth
            // alongside the compile-time kDevToolEnabled dart-define).
            resValue "bool", "jeeb_devtool_enabled", "false"
        }
    }

    signingConfigs {
        // Release signing, driven by android/key.properties (gitignored).
        // Populated only when the properties file is present so CI/dev machines
        // without the keystore can still assemble a (debug-signed) release.
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Use the real release keystore when key.properties is present;
            // otherwise fall back to debug signing (previous placeholder behaviour).
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
}
