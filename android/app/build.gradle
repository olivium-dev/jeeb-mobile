plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // PUSH-WIRING: apply the Google Services plugin (declared apply-false in
    // settings.gradle v4.4.2) so the bundled google-services.json is merged
    // into the per-flavor applicationId (app.jeeb.mobile.dev) and
    // Firebase.initializeApp() loads FirebaseOptions from the generated
    // resource instead of falling back to the Noop reporter.
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Keep the Maps credential out of source control. Local Android builds read it
// from the gitignored local.properties; CI can inject it as an environment
// variable or an explicit Gradle property.
def mapsApiKey = (
    project.hasProperty('MAPS_API_KEY')
        ? project.property('MAPS_API_KEY')
        : localProperties.getProperty('MAPS_API_KEY', System.getenv('MAPS_API_KEY') ?: '')
).toString().trim()
def mapsApiKeyIsValid = mapsApiKey ==~ /^AIza[0-9A-Za-z_-]{30,}$/

// Release signing material — read from android/key.properties (gitignored; see
// android/.gitignore). Production release tasks fail closed when this material
// is incomplete. They must never fall back to the local debug signer.
def keystoreProperties = new Properties()
def signingPropertiesOverride = project.findProperty(
    'jeeb.releaseSigningPropertiesFile'
)?.toString()?.trim()
def keystorePropertiesFile = signingPropertiesOverride
    ? rootProject.file(signingPropertiesOverride)
    : rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def requiredReleaseSigningProperties = [
    'keyAlias',
    'keyPassword',
    'storeFile',
    'storePassword',
]
def releaseSigningPropertiesComplete = keystorePropertiesFile.exists() &&
    requiredReleaseSigningProperties.every { propertyName ->
        keystoreProperties.getProperty(propertyName, '').toString().trim()
    }
def releaseKeystoreFile = releaseSigningPropertiesComplete
    ? file(keystoreProperties.getProperty('storeFile'))
    : null
def expectedUploadCertificateSha1 = (
    project.findProperty('jeeb.uploadSigningCertificateSha1')
        ?: System.getenv('ANDROID_UPLOAD_CERT_SHA1')
        ?: ''
).toString().trim()
def expectedUploadCertificateSha256 = (
    project.findProperty('jeeb.uploadSigningCertificateSha256')
        ?: System.getenv('ANDROID_UPLOAD_CERT_SHA256')
        ?: ''
).toString().trim()

def normalizedCertificateFingerprint = { String fingerprint ->
    fingerprint.replace(':', '').toUpperCase(Locale.ROOT)
}

def signingCertificateFingerprint = {
    File keystoreFile, String password, String alias, String algorithm ->
    def keyStore = java.security.KeyStore.getInstance(
        keystoreFile,
        password.toCharArray()
    )
    def certificate = keyStore.getCertificate(alias)
    if (certificate == null) {
        throw new GradleException(
            'Production release signing certificate is unavailable.'
        )
    }
    def digest = java.security.MessageDigest.getInstance(algorithm)
        .digest(certificate.encoded)
    digest.collect { value -> String.format('%02X', value & 0xff) }.join()
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.olivium.jeeb"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.olivium.jeeb"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Android Maps SDK key injected via the ${MAPS_API_KEY} manifest
        // placeholder (see the google_maps_flutter note in pubspec.yaml and the
        // com.google.android.geo.API_KEY meta-data in AndroidManifest.xml).
        // `+=` preserves Flutter's ${applicationName} placeholder. The
        // verifyMapsApiKey dependency below stops manifest processing before
        // this sentinel can ever reach an APK.
        manifestPlaceholders += [
            MAPS_API_KEY: mapsApiKey ?: 'MISSING_MAPS_API_KEY',
            APP_LINK_HOST: 'app.jeeb.fds-1.com',
        ]
    }

    // Dev Tool second launcher icon, opt-in even on dev/staging:
    // `flutter build apk --flavor dev -Pjeeb.devtool=true`.
    def devToolLauncherEnabled =
        project.findProperty('jeeb.devtool')?.toString() == 'true'
            ? 'true'
            : 'false'

    // ─── Flavor Configuration ────────────────────────────────────────────────
    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            // Preserve the existing developer-only Firebase registration.
            // Store candidates never use this flavor.
            applicationId "app.jeeb.mobile.dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Jeeb Dev"
            // Opt-IN (-Pjeeb.devtool=true): a normal dev build must ship ONE
            // launcher, or the launcher/monkey can open the Dev Tool alias.
            resValue "bool", "jeeb_devtool_enabled", devToolLauncherEnabled
            resValue "bool", "jeeb_internal_release", "false"
            resValue "string", "devtool_name", "Jeeber Dev Tool"
            buildConfigField "boolean", "JEEB_INTERNAL_RELEASE", "false"
            // Preserve the developer deep-link host while release candidates
            // verify against the canonical staging Cloudflare edge.
            manifestPlaceholders.APP_LINK_HOST = 'jeeb.app'
        }
        staging {
            dimension "environment"
            // Staging is runtime configuration, never a second store identity.
            applicationId "com.olivium.jeeb"
            versionNameSuffix "-stg"
            resValue "string", "app_name", "Jeeb Staging"
            resValue "bool", "jeeb_devtool_enabled", devToolLauncherEnabled
            resValue "bool", "jeeb_internal_release", "false"
            resValue "string", "devtool_name", "Jeeber Dev Tool"
            buildConfigField "boolean", "JEEB_INTERNAL_RELEASE", "false"
            manifestPlaceholders.APP_LINK_HOST = 'app.jeeb.fds-1.com'
        }
        internalRelease {
            dimension "environment"
            // Play Internal Testing keeps the permanent store identity. The
            // runtime remains staging and the dedicated QA activity is the
            // only release-only developer surface.
            applicationId "com.olivium.jeeb"
            resValue "string", "app_name", "Jeeb Internal"
            resValue "string", "devtool_name", "Jeeb Internal QA"
            resValue "bool", "jeeb_devtool_enabled", "true"
            resValue "bool", "jeeb_internal_release", "true"
            buildConfigField "boolean", "JEEB_INTERNAL_RELEASE", "true"
            manifestPlaceholders.APP_LINK_HOST = 'app.jeeb.fds-1.com'
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Jeeb"
            // Production hides the Dev Tool launcher icon (defence-in-depth
            // alongside the compile-time kDevToolEnabled dart-define).
            resValue "bool", "jeeb_devtool_enabled", "false"
            resValue "bool", "jeeb_internal_release", "false"
            resValue "string", "devtool_name", "Jeeb"
            buildConfigField "boolean", "JEEB_INTERNAL_RELEASE", "false"
            manifestPlaceholders.APP_LINK_HOST = 'app.jeeb.fds-1.com'
        }
    }

    signingConfigs {
        // Release signing, driven by android/key.properties (gitignored).
        // Debug builds do not use this configuration. Production release tasks
        // depend on verifyProductionReleaseSigning below and fail before an
        // artifact is packaged when the configuration is unavailable.
        release {
            if (releaseSigningPropertiesComplete) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def verifyProductionReleaseSigning = tasks.register('verifyProductionReleaseSigning') {
    group = 'verification'
    description = 'Fails production release builds unless approved signing inputs are complete.'
    doLast {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException(
                'Production release signing is unavailable. Provide the protected signing inputs.'
            )
        }
        if (!releaseSigningPropertiesComplete) {
            throw new GradleException(
                'Production release signing is incomplete. Required protected inputs are missing.'
            )
        }
        if (releaseKeystoreFile == null || !releaseKeystoreFile.isFile() ||
            !releaseKeystoreFile.canRead()) {
            throw new GradleException(
                'Production release keystore is unavailable or unreadable.'
            )
        }
        def configuredAlias = keystoreProperties.getProperty('keyAlias', '').trim()
        def localDebugKeystore = new File(
            System.getProperty('user.home'),
            '.android/debug.keystore'
        )
        if (configuredAlias.equalsIgnoreCase('androiddebugkey') ||
            releaseKeystoreFile.canonicalFile == localDebugKeystore.canonicalFile ||
            releaseKeystoreFile.name.equalsIgnoreCase('debug.keystore')) {
            throw new GradleException(
                'Production release signing rejected a debug signing identity.'
            )
        }
        if (!(expectedUploadCertificateSha1 ==~
            /(?i)(?:[0-9a-f]{40}|(?:[0-9a-f]{2}:){19}[0-9a-f]{2})/)) {
            throw new GradleException(
                'Protected upload signing certificate SHA-1 is missing or malformed.'
            )
        }
        if (!(expectedUploadCertificateSha256 ==~
            /(?i)(?:[0-9a-f]{64}|(?:[0-9a-f]{2}:){31}[0-9a-f]{2})/)) {
            throw new GradleException(
                'Protected upload signing certificate SHA-256 is missing or malformed.'
            )
        }
        def actualCertificateSha1
        def actualCertificateSha256
        try {
            actualCertificateSha1 = signingCertificateFingerprint(
                releaseKeystoreFile,
                keystoreProperties.getProperty('storePassword'),
                configuredAlias,
                'SHA-1'
            )
            actualCertificateSha256 = signingCertificateFingerprint(
                releaseKeystoreFile,
                keystoreProperties.getProperty('storePassword'),
                configuredAlias,
                'SHA-256'
            )
        } catch (GradleException error) {
            throw error
        } catch (Exception ignored) {
            throw new GradleException(
                'Production release signing certificate could not be inspected.'
            )
        }
        if (actualCertificateSha1 != normalizedCertificateFingerprint(
            expectedUploadCertificateSha1
        )) {
            throw new GradleException(
                'Production release signer does not match the approved upload SHA-1.'
            )
        }
        if (actualCertificateSha256 != normalizedCertificateFingerprint(
            expectedUploadCertificateSha256
        )) {
            throw new GradleException(
                'Production release signer does not match the approved upload SHA-256.'
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name != verifyProductionReleaseSigning.name &&
        (task.name.toLowerCase().contains('productionrelease') ||
            task.name.toLowerCase().contains('internalreleaserelease'))) {
        task.dependsOn(verifyProductionReleaseSigning)
    }
}

flutter {
    source '../..'
}

def verifyMapsApiKey = tasks.register('verifyMapsApiKey') {
    group = 'verification'
    description = 'Fails Android app builds when the Google Maps SDK key is missing or malformed.'
    doLast {
        if (!mapsApiKeyIsValid) {
            throw new GradleException(
                'Missing or malformed MAPS_API_KEY. Add it to the gitignored ' +
                'android/local.properties or inject MAPS_API_KEY in CI.'
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('process') && task.name.endsWith('MainManifest')) {
        task.dependsOn(verifyMapsApiKey)
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
}
