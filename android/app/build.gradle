plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ─── T-MOB-012 / T-MOB-017: Google Maps API key (INJECTABLE, never committed) ──
// Resolution priority:
//   1. -PMAPS_API_KEY=... gradle property (CI: pass via --project-prop or
//      ORG_GRADLE_PROJECT_MAPS_API_KEY env var)
//   2. MAPS_API_KEY environment variable (local dev / CI secret)
//   3. local.properties `MAPS_API_KEY=...` (gitignored; the owner's one-liner)
//   4. documented sentinel so the build never breaks without a key
// The resolved value feeds the `${MAPS_API_KEY}` manifest placeholder; the key
// is NOT a Dart compile-time constant, so it never lands in lib/ or a snapshot.
def mapsApiKey = project.findProperty('MAPS_API_KEY')
        ?: System.getenv('MAPS_API_KEY')
        ?: localProperties.getProperty('MAPS_API_KEY')
        ?: 'YOUR_MAPS_API_KEY_HERE'

android {
    namespace "app.jeeb.mobile"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "app.jeeb.mobile"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // T-MOB-012 / T-MOB-017: feed the Maps key into the AndroidManifest
        // `${MAPS_API_KEY}` placeholder. Applies to every flavor + build type.
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    // ─── Flavor Configuration ────────────────────────────────────────────────
    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Jeeb Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-stg"
            resValue "string", "app_name", "Jeeb Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Jeeb"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // TODO: replace with release keystore
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
}
