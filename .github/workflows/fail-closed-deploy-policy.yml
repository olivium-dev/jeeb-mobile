name: Fail-closed deploy policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject deployment reversion paths
        run: python3 tool/check_fail_closed_deployment.py
      - name: Verify maintainable CI topology
        run: python3 tool/check_ci_topology.py
      - name: Verify deterministic Flutter test sharding
        run: python3 tool/test_plan_test_shards.py
      - name: Verify isolated store preflight gates
        run: python3 tool/test_store_inventory_preflight.py
      - name: Set up repository Ruby for credential-free fixtures
        uses: ./.github/actions/setup-ruby
      - name: Verify store lifecycle and pinned SDK without credentials
        run: |
          bundle exec ruby tool/test_store_inventory_preflight.rb
          bundle exec ruby tool/test_store_inventory_sdk.rb
