name: Distribute full Android Dev Tool internally

run-name: Android Internal Dev Tool ${{ inputs.build_name }}+${{ inputs.build_number }} from ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful trusted Android internal Dev Tool run ID
        required: true
        type: string
      reviewed_sha:
        description: Exact reviewed protected-main commit in the candidate
        required: true
        type: string
      build_name:
        description: Exact retained version name
        required: true
        type: string
      build_number:
        description: Exact retained version code
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-internal-devtool-distribution-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  source-policy:
    name: Verify protected source run and immutable retained candidate
    environment: mobile-internal-distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_run_attempt: ${{ steps.policy.outputs.source_run_attempt }}
      artifact_id: ${{ steps.policy.outputs.artifact_id }}
      artifact_archive_sha256: ${{ steps.policy.outputs.artifact_archive_sha256 }}
      candidate_cms_sha256: ${{ steps.policy.outputs.candidate_cms_sha256 }}
      aab_sha256: ${{ steps.policy.outputs.aab_sha256 }}
      metadata_sha256: ${{ steps.policy.outputs.metadata_sha256 }}
      provenance_sha256: ${{ steps.policy.outputs.provenance_sha256 }}
      mapping_sha256: ${{ steps.policy.outputs.mapping_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source run, artifact digest, and candidate bindings
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_WORKFLOW_REF: olivium-dev/jeeb-mobile/.github/workflows/trusted-android-internal-devtool-rc.yml@refs/heads/main
          ANDROID_CANDIDATE_DECRYPT_KEY_B64: ${{ secrets.ANDROID_CANDIDATE_DECRYPT_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          [[ "${GITHUB_REF}" == refs/heads/main ]]
          [[ "${GITHUB_REPOSITORY}" == olivium-dev/jeeb-mobile ]]
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REVIEWED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BUILD_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]]
          (( 10#${BUILD_NUMBER} >= 26082601 ))
          (( 10#${BUILD_NUMBER} <= 2100000000 ))
          [[ "$(git rev-parse HEAD)" == "${REVIEWED_SHA}" ]]

          source_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e --arg reviewed "${REVIEWED_SHA}" '
            .path == ".github/workflows/trusted-android-internal-devtool-rc.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .head_sha == $reviewed
            and .status == "completed"
            and .conclusion == "success"
            and (.run_attempt | type == "number" and . >= 1)
          ' <<<"${source_json}" >/dev/null
          source_attempt="$(jq -r '.run_attempt' <<<"${source_json}")"
          artifacts="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          artifact_name="android-internal-devtool-${BUILD_NUMBER}-${REVIEWED_SHA}-attempt-${source_attempt}"
          record="$(jq -ce --arg expected "${artifact_name}" '
            [.artifacts[] | select(
              .name == $expected
              and .expired == false
              and (.id | type == "number" and . >= 1)
              and (.digest | type == "string"
                and test("^sha256:[0-9a-f]{64}$"))
            )] | if length == 1 then .[0] else error("artifact mismatch") end
          ' <<<"${artifacts}")"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "${tmp_dir}"' EXIT HUP INT TERM
          archive="${tmp_dir}/candidate.zip"
          artifact_id="$(jq -r '.id' <<<"${record}")"
          expected_archive_sha="$(jq -r '.digest | sub("^sha256:"; "")' \
            <<<"${record}")"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            >"${archive}"
          archive_sha="$(sha256sum "${archive}" | cut -d ' ' -f1)"
          [[ "${archive_sha}" == "${expected_archive_sha}" ]]
          ciphertext="${tmp_dir}/candidate.cms"
          python3 tool/android_internal_candidate_custody.py extract-artifact \
            --archive "${archive}" --output "${ciphertext}"
          [[ -n "${ANDROID_CANDIDATE_DECRYPT_KEY_B64:-}" ]] || exit 1
          private_key="${tmp_dir}/candidate-private-key.pem"
          printf '%s' "${ANDROID_CANDIDATE_DECRYPT_KEY_B64}" | \
            base64 --decode >"${private_key}"
          unset ANDROID_CANDIDATE_DECRYPT_KEY_B64
          chmod 0600 "${private_key}"
          recipient_cert="${GITHUB_WORKSPACE}/.github/release/android-internal-candidate-recipient.pem"
          validation="$({
          ANDROID_PACKAGE_NAME=com.olivium.jeeb \
          MOBILE_BUILD_NAME="${BUILD_NAME}" \
          MOBILE_BUILD_NUMBER="${BUILD_NUMBER}" \
          REVIEWED_SHA="${REVIEWED_SHA}" \
          SOURCE_RUN_ID="${SOURCE_RUN_ID}" \
          SOURCE_RUN_ATTEMPT="${source_attempt}" \
          SOURCE_WORKFLOW_REF="${SOURCE_WORKFLOW_REF}" \
          JEEB_DEVTOOL_BUILD=true \
          JEEB_SUPER_LOGIN_ENABLED=true \
          JEEB_DEVTOOL_SHAKE_ENABLED=false \
          JEEB_CLARITY_ENABLED=false \
          JEEB_CLARITY_PRIVACY_APPROVED=false \
          JEEB_RELEASE_PROFILE=release \
            bash tool/validate_encrypted_android_internal_candidate.sh \
              "${ciphertext}" "${recipient_cert}" "${private_key}" \
              "${tmp_dir}/private-candidate"
          } 2>"${tmp_dir}/validation-error.txt")" || {
            printf '%s\n' 'Encrypted candidate validation failed' >&2
            exit 1
          }
          candidate_cms_sha="$(sed -n 's/^candidate_cms_sha256=//p' <<<"${validation}")"
          aab_sha="$(sed -n 's/^aab_sha256=//p' <<<"${validation}")"
          metadata_sha="$(sed -n 's/^metadata_sha256=//p' <<<"${validation}")"
          provenance_sha="$(sed -n 's/^provenance_sha256=//p' <<<"${validation}")"
          mapping_sha="$(sed -n 's/^mapping_sha256=//p' <<<"${validation}")"
          for digest in "${candidate_cms_sha}" "${aab_sha}" "${metadata_sha}" \
            "${provenance_sha}" "${mapping_sha}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          done
          unset validation

          environment_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/environments/mobile-internal-distribution")"
          jq -e '
            .name == "mobile-internal-distribution"
            and .deployment_branch_policy.protected_branches == true
            and .deployment_branch_policy.custom_branch_policies == false
          ' <<<"${environment_json}" >/dev/null
          {
            printf 'source_run_attempt=%s\n' "${source_attempt}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_archive_sha256=%s\n' "${archive_sha}"
            printf 'candidate_cms_sha256=%s\n' "${candidate_cms_sha}"
            printf 'aab_sha256=%s\n' "${aab_sha}"
            printf 'metadata_sha256=%s\n' "${metadata_sha}"
            printf 'provenance_sha256=%s\n' "${provenance_sha}"
            printf 'mapping_sha256=%s\n' "${mapping_sha}"
          } >>"${GITHUB_OUTPUT}"

  store-build-number-preflight:
    name: Re-read both store maxima before internal distribution
    needs: source-policy
    environment: mobile-internal-distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - name: Set up repository Ruby
        uses: ./.github/actions/setup-ruby
      - name: Enforce fresh shared mobile build-number policy
        env:
          MOBILE_BUILD_NAME: ${{ inputs.build_name }}
          MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_CONTENT_B64: ${{ secrets.APP_STORE_KEY_CONTENT_B64 }}
        run: bundle exec fastlane preflight_internal

  play-internal:
    name: Upload exact full Dev Tool AAB to Play Internal only
    needs: [source-policy, store-build-number-preflight]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: mobile-internal-distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - name: Set up repository Ruby
        uses: ./.github/actions/setup-ruby
      - name: REST re-download, decrypt privately, and reverify exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.source-policy.outputs.source_run_attempt }}
          SOURCE_WORKFLOW_REF: olivium-dev/jeeb-mobile/.github/workflows/trusted-android-internal-devtool-rc.yml@refs/heads/main
          ARTIFACT_ID: ${{ needs.source-policy.outputs.artifact_id }}
          EXPECTED_ARCHIVE_SHA: ${{ needs.source-policy.outputs.artifact_archive_sha256 }}
          EXPECTED_CANDIDATE_CMS_SHA: ${{ needs.source-policy.outputs.candidate_cms_sha256 }}
          EXPECTED_AAB_SHA: ${{ needs.source-policy.outputs.aab_sha256 }}
          EXPECTED_METADATA_SHA: ${{ needs.source-policy.outputs.metadata_sha256 }}
          EXPECTED_PROVENANCE_SHA: ${{ needs.source-policy.outputs.provenance_sha256 }}
          EXPECTED_MAPPING_SHA: ${{ needs.source-policy.outputs.mapping_sha256 }}
          ANDROID_CANDIDATE_DECRYPT_KEY_B64: ${{ secrets.ANDROID_CANDIDATE_DECRYPT_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          tmp_dir="$(mktemp -d)"
          root='${{ runner.temp }}/android-internal-devtool-private'
          validation_complete=false
          erase_private_root() {
            if [[ -d "${root}" ]]; then
              find "${root}" -type f -delete
              find "${root}" -depth -type d -empty -delete
            fi
          }
          cleanup() {
            if [[ "${validation_complete}" != true ]]; then
              erase_private_root
            fi
            rm -rf -- "${tmp_dir}"
          }
          trap cleanup EXIT HUP INT TERM
          archive="${tmp_dir}/candidate-artifact.zip"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            >"${archive}"
          [[ "$(sha256sum "${archive}" | cut -d ' ' -f1)" == \
            "${EXPECTED_ARCHIVE_SHA}" ]]
          ciphertext="${tmp_dir}/candidate.cms"
          python3 tool/android_internal_candidate_custody.py extract-artifact \
            --archive "${archive}" --output "${ciphertext}"
          [[ "$(sha256sum "${ciphertext}" | cut -d ' ' -f1)" == \
            "${EXPECTED_CANDIDATE_CMS_SHA}" ]]
          [[ -n "${ANDROID_CANDIDATE_DECRYPT_KEY_B64:-}" ]] || exit 1
          private_key="${tmp_dir}/candidate-private-key.pem"
          printf '%s' "${ANDROID_CANDIDATE_DECRYPT_KEY_B64}" | \
            base64 --decode >"${private_key}"
          unset ANDROID_CANDIDATE_DECRYPT_KEY_B64
          chmod 0600 "${private_key}"
          recipient_cert="${GITHUB_WORKSPACE}/.github/release/android-internal-candidate-recipient.pem"
          [[ ! -e "${root}" ]]
          validation="$({
          ANDROID_PACKAGE_NAME=com.olivium.jeeb \
          MOBILE_BUILD_NAME="${BUILD_NAME}" \
          MOBILE_BUILD_NUMBER="${BUILD_NUMBER}" \
          REVIEWED_SHA="${REVIEWED_SHA}" \
          SOURCE_RUN_ID="${SOURCE_RUN_ID}" \
          SOURCE_RUN_ATTEMPT="${SOURCE_RUN_ATTEMPT}" \
          SOURCE_WORKFLOW_REF="${SOURCE_WORKFLOW_REF}" \
          JEEB_DEVTOOL_BUILD=true \
          JEEB_SUPER_LOGIN_ENABLED=true \
          JEEB_DEVTOOL_SHAKE_ENABLED=false \
          JEEB_CLARITY_ENABLED=false \
          JEEB_CLARITY_PRIVACY_APPROVED=false \
          JEEB_RELEASE_PROFILE=release \
            bash tool/validate_encrypted_android_internal_candidate.sh \
              "${ciphertext}" "${recipient_cert}" "${private_key}" "${root}"
          } 2>"${tmp_dir}/validation-error.txt")" || {
            printf '%s\n' 'Encrypted candidate revalidation failed' >&2
            exit 1
          }
          [[ "$(sed -n 's/^candidate_cms_sha256=//p' <<<"${validation}")" == \
            "${EXPECTED_CANDIDATE_CMS_SHA}" ]]
          [[ "$(sed -n 's/^aab_sha256=//p' <<<"${validation}")" == \
            "${EXPECTED_AAB_SHA}" ]]
          [[ "$(sed -n 's/^metadata_sha256=//p' <<<"${validation}")" == \
            "${EXPECTED_METADATA_SHA}" ]]
          [[ "$(sed -n 's/^provenance_sha256=//p' <<<"${validation}")" == \
            "${EXPECTED_PROVENANCE_SHA}" ]]
          [[ "$(sed -n 's/^mapping_sha256=//p' <<<"${validation}")" == \
            "${EXPECTED_MAPPING_SHA}" ]]
          unset validation
          validation_complete=true
          {
            printf 'aab_path=%s\n' "${root}/candidate.aab"
            printf 'metadata_path=%s\n' "${root}/output-metadata.json"
            printf 'provenance_path=%s\n' "${root}/provenance.json"
          } >>"${GITHUB_OUTPUT}"
      - name: Upload provenance-verified AAB to Internal Testing only
        working-directory: android
        env:
          ANDROID_AAB_PATH: ${{ steps.candidate.outputs.aab_path }}
          ANDROID_METADATA_PATH: ${{ steps.candidate.outputs.metadata_path }}
          ANDROID_PROVENANCE_PATH: ${{ steps.candidate.outputs.provenance_path }}
          ANDROID_PACKAGE_NAME: com.olivium.jeeb
          MOBILE_BUILD_NAME: ${{ inputs.build_name }}
          MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.source-policy.outputs.source_run_attempt }}
          SOURCE_WORKFLOW_REF: olivium-dev/jeeb-mobile/.github/workflows/trusted-android-internal-devtool-rc.yml@refs/heads/main
          JEEB_DEVTOOL_BUILD: 'true'
          JEEB_SUPER_LOGIN_ENABLED: 'true'
          JEEB_DEVTOOL_SHAKE_ENABLED: 'false'
          JEEB_CLARITY_ENABLED: 'false'
          JEEB_CLARITY_PRIVACY_APPROVED: 'false'
          JEEB_RELEASE_PROFILE: release
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: bundle exec fastlane android internal_devtool
      - name: Erase private plaintext candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          private_root='${{ runner.temp }}/android-internal-devtool-private'
          if [[ -d "${private_root}" ]]; then
            find "${private_root}" -type f -delete
            find "${private_root}" -depth -type d -empty -delete
          fi
          [[ ! -e "${private_root}" ]]
      - name: Record internal-only distribution receipt
        env:
          AAB_SHA256: ${{ needs.source-policy.outputs.aab_sha256 }}
        run: |
          mkdir -p build/distribution-receipts
          jq -n \
            --arg artifact_sha256 "${AAB_SHA256}" \
            --arg source_run_id '${{ inputs.source_run_id }}' \
            --arg source_run_attempt '${{ needs.source-policy.outputs.source_run_attempt }}' \
            --arg reviewed_sha '${{ inputs.reviewed_sha }}' \
            --arg version_name '${{ inputs.build_name }}' \
            --arg version_code '${{ inputs.build_number }}' \
            '{platform:"android", destination:"google-play-internal",
              artifact_sha256:$artifact_sha256,
              source_run_id:$source_run_id,
              source_run_attempt:$source_run_attempt,
              reviewed_sha:$reviewed_sha, version_name:$version_name,
              version_code:$version_code, devtool:true, super_login:true,
              shake_to_open:false,
              clarity_enabled:false, release_profile:true}' \
            >build/distribution-receipts/android-internal-devtool.json
      - name: Retain internal distribution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-internal-devtool-receipt-${{ inputs.build_number }}-${{ inputs.source_run_id }}
          path: build/distribution-receipts/android-internal-devtool.json
          if-no-files-found: error
          retention-days: 30
