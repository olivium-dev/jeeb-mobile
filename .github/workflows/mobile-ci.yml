name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # nightly UTC

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  l10n-parity:
    name: L10n parity gate (T-MOB-FIX-002)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout repository-pinned OMDS dependency
        uses: ./.github/actions/checkout-omds
        with:
          token: ${{ secrets.OMDS_FLUTTER_PAT || github.token }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Flutter from .fvmrc
        uses: ./.github/actions/setup-flutter

      - name: Install Flutter dependencies (needed for runtime parity tests)
        id: pub_get
        run: flutter pub get --enforce-lockfile

      - name: Restore and regenerate source graph
        uses: ./.github/actions/run-build-runner

      - name: firebase_core pin gate
        run: bash tool/check_firebase_core_pin.sh

      - name: Static 4-set parity (AC1, AC3, AC5)
        env:
          OUT_DIR: ${{ github.workspace }}/_artifacts/l10n
        run: bash qa/t-mob-fix-002/l10n_parity_check.sh --analyze

      - name: AR CLDR plural forms (AC6 — ARB side)
        env:
          OUT_DIR: ${{ github.workspace }}/_artifacts/l10n
        run: bash qa/t-mob-fix-002/ar_plurals_check.sh

      - name: Runtime parity + plural unit tests (AC1 d/e + AC6 runtime) — requires omds
        run: flutter test test/l10n/ --reporter=expanded

      - name: Upload parity artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l10n-parity-artifacts
          path: |
            _artifacts/l10n/
          if-no-files-found: ignore
          retention-days: 14
