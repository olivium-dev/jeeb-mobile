name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # nightly UTC

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  l10n-parity:
    name: L10n parity gate (T-MOB-FIX-002)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static 4-set parity (AC1, AC3, AC5)
        env:
          OUT_DIR: ${{ github.workspace }}/_artifacts/l10n
        run: |
          mkdir -p "$OUT_DIR"
          bash qa/t-mob-fix-002/l10n_parity_check.sh --analyze

      - name: AR CLDR plural forms (AC6 — ARB side)
        env:
          OUT_DIR: ${{ github.workspace }}/_artifacts/l10n
        run: bash qa/t-mob-fix-002/ar_plurals_check.sh

      - name: Runtime parity + plural unit tests (AC1 d/e + AC6 runtime)
        run: flutter test test/l10n/ --reporter=expanded

      - name: Upload parity artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: l10n-parity-artifacts
          path: |
            _artifacts/l10n/
          if-no-files-found: ignore
          retention-days: 14
