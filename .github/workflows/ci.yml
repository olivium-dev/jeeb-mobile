name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        run: flutter pub get

      - name: Analyze
        # `dart analyze` instead of `flutter analyze`: flutter analyze crashes
        # with exit code 64 while bootstrapping native-assets in CI. dart analyze
        # performs the same static analysis without that codepath. --fatal-infos
        # preserves the previous strictness (infos + warnings fail the build).
        run: dart analyze --fatal-infos .

  test:
    name: Test
    runs-on: ubuntu-latest
    # The current Flutter suite exceeds ten minutes on hosted runners.
    timeout-minutes: 20
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter=expanded

  build-apk:
    name: Build APK (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        run: flutter pub get

      - name: Validate Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Required repository secret MAPS_API_KEY is not configured."
            exit 1
          fi

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --flavor dev --debug --dart-define=APP_FLAVOR=dev
