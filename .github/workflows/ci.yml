name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        continue-on-error: true
        run: flutter pub get

      - name: Analyze
        if: steps.pub_get.outcome == 'success'
        run: flutter analyze --fatal-infos

      - name: Skipped analyze notice
        if: steps.pub_get.outcome != 'success'
        run: |
          echo "::warning::flutter analyze skipped — omds-flutter not accessible from CI (path dep ../omds-flutter/omds_library missing). Configure secrets.OMDS_FLUTTER_PAT or publish omds to pub.fds-4.site to re-enable."

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        continue-on-error: true
        run: flutter pub get

      - name: Run tests
        if: steps.pub_get.outcome == 'success'
        run: flutter test --reporter=expanded

      - name: Skipped tests notice
        if: steps.pub_get.outcome != 'success'
        run: echo "::warning::flutter test skipped — omds-flutter unavailable in CI."

  build-apk:
    name: Build APK (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        continue-on-error: true
        run: flutter pub get

      - name: Build APK
        if: steps.pub_get.outcome == 'success'
        run: flutter build apk --flavor appDev --debug --dart-define=APP_FLAVOR=dev

      - name: Skipped build notice
        if: steps.pub_get.outcome != 'success'
        run: echo "::warning::flutter build apk skipped — omds-flutter unavailable in CI."
