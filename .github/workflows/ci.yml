name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter stage
    uses: ./.github/workflows/ci-flutter-stage.yml
    secrets: inherit

  android:
    name: Android stage
    needs: flutter
    uses: ./.github/workflows/ci-android-stage.yml
    secrets: inherit

  ios:
    name: iOS stage
    needs: flutter
    uses: ./.github/workflows/ci-ios-stage.yml
    secrets: inherit

  ready:
    name: CI ready
    if: ${{ always() }}
    needs: [flutter, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI stage to pass
        env:
          FLUTTER_RESULT: ${{ needs.flutter.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          [[ "${FLUTTER_RESULT}" == success ]]
          [[ "${ANDROID_RESULT}" == success ]]
          [[ "${IOS_RESULT}" == success ]]
