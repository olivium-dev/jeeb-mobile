name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Keep in step with ci.yml and the Mac Studio build machine (~/flutter-3.44).
  FLUTTER_VERSION: '3.44.2'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        run: flutter pub get

      - name: firebase_core pin gate
        run: bash tool/check_firebase_core_pin.sh

      - name: Analyze
        # `dart analyze` avoids the `flutter analyze` exit-code-64 crash that
        # happens while bootstrapping native-assets in CI. --fatal-infos keeps
        # the prior strictness.
        run: dart analyze --fatal-infos .

      - name: Run tests
        # See ci.yml — the `capture` harnesses are host-rendered golden tooling.
        run: flutter test --exclude-tags capture --coverage

      - name: Coverage summary (lcov)
        # Surfaces aggregate line coverage from coverage/lcov.info produced above.
        # Raise the failure threshold here once a baseline is agreed (e.g. add
        # `lcov --fail-under-lines <N> lcov.info`).
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info

      - name: Validate Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Required repository secret MAPS_API_KEY is not configured."
            exit 1
          fi

      - name: Build APK (debug)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --flavor dev --debug
