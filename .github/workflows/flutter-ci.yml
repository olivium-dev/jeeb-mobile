name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-test-build:
    name: Flutter CI + coverage (79%)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history so the diff-scoped design-token gate can resolve its
          # merge base against the target branch.
          fetch-depth: 0

      - name: Checkout repository-pinned OMDS dependency
        uses: ./.github/actions/checkout-omds
        with:
          token: ${{ secrets.OMDS_FLUTTER_PAT || github.token }}

      - name: Set up Flutter from .fvmrc
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        id: pub_get
        run: flutter pub get --enforce-lockfile

      - name: Restore and regenerate source graph
        uses: ./.github/actions/run-build-runner

      - name: firebase_core pin gate
        run: bash tool/check_firebase_core_pin.sh

      - name: Analyze
        # `dart analyze` avoids the `flutter analyze` exit-code-64 crash that
        # happens while bootstrapping native-assets in CI. --fatal-infos keeps
        # the prior strictness.
        run: dart analyze --fatal-infos .

      - name: Design token compliance gate (diff-scoped)
        # Scoped to the files this branch changed: the full-tree scan still
        # fails on pre-existing violations each owning WP clears as it migrates.
        env:
          DESIGN_TOKENS_BASE: origin/${{ github.base_ref || github.event.repository.default_branch || 'main' }}
        run: bash tool/check_design_tokens.sh

      - name: Run tests
        # See ci.yml — the `capture` harnesses are host-rendered golden tooling.
        run: flutter test --exclude-tags capture --coverage

      - name: Enforce 79% line coverage floor
        uses: VeryGoodOpenSource/very_good_coverage@c953fca3e24a915e111cc6f55f03f756dcb3964c # v3.0.0
        with:
          path: coverage/lcov.info
          min_coverage: 79
          exclude: >-
            **/*.g.dart **/*.freezed.dart **/main.dart
            **/firebase_options.dart **/*.config.dart

      - name: Skip dev FCM APK for fork PR
        if: github.event_name == 'pull_request'
        run: echo "Secret-dependent dev FCM APK build is skipped; analyze and tests already ran."

      - name: Validate Maps API key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Required repository secret MAPS_API_KEY is not configured."
            exit 1
          fi

      - name: Build APK with protected dev Firebase config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          DEV_GOOGLE_SERVICES_JSON_B64: ${{ secrets.DEV_GOOGLE_SERVICES_JSON_B64 }}
          DEV_FIREBASE_EXPECTED_PROJECT_NUMBER: ${{ secrets.DEV_FIREBASE_EXPECTED_PROJECT_NUMBER }}
          DEV_FIREBASE_EXPECTED_PROJECT_ID: ${{ secrets.DEV_FIREBASE_EXPECTED_PROJECT_ID }}
          DEV_FIREBASE_EXPECTED_APP_ID: ${{ secrets.DEV_FIREBASE_EXPECTED_APP_ID }}
        run: >-
          bash tool/run_with_dev_firebase_config.sh
          flutter build apk --flavor dev --debug
          --dart-define=REQUIRE_REAL_PUSH=true
