name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Keep in step with ci.yml and the Mac Studio build machine (~/flutter-3.44).
  FLUTTER_VERSION: '3.44.2'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        run: flutter pub get --enforce-lockfile

      - name: firebase_core pin gate
        run: bash tool/check_firebase_core_pin.sh

      - name: Analyze
        # `dart analyze` avoids the `flutter analyze` exit-code-64 crash that
        # happens while bootstrapping native-assets in CI. --fatal-infos keeps
        # the prior strictness.
        run: dart analyze --fatal-infos .

      - name: Run tests
        # See ci.yml — the `capture` harnesses are host-rendered golden tooling.
        run: flutter test --exclude-tags capture --coverage

      - name: Coverage summary (lcov)
        # Surfaces aggregate line coverage from coverage/lcov.info produced above.
        # Raise the failure threshold here once a baseline is agreed (e.g. add
        # `lcov --fail-under-lines <N> lcov.info`).
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info

      - name: Inject and validate dev Firebase config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEV_GOOGLE_SERVICES_JSON_B64: ${{ secrets.DEV_GOOGLE_SERVICES_JSON_B64 }}
          DEV_FIREBASE_EXPECTED_PROJECT_NUMBER: ${{ secrets.DEV_FIREBASE_EXPECTED_PROJECT_NUMBER }}
          DEV_FIREBASE_EXPECTED_PROJECT_ID: ${{ secrets.DEV_FIREBASE_EXPECTED_PROJECT_ID }}
          DEV_FIREBASE_EXPECTED_APP_ID: ${{ secrets.DEV_FIREBASE_EXPECTED_APP_ID }}
        run: |
          printf '%s' "$DEV_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/src/dev/google-services.json
          bash tool/validate_dev_google_services.sh

      - name: Skip dev FCM APK for fork PR
        if: github.event_name == 'pull_request'
        run: echo "Secret-dependent dev FCM APK build is skipped; analyze and tests already ran."

      - name: Validate Maps API key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Required repository secret MAPS_API_KEY is not configured."
            exit 1
          fi

      - name: Build APK (debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --flavor dev --debug --dart-define=REQUIRE_REAL_PUSH=true
