name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        continue-on-error: true
        run: flutter pub get

      - name: Analyze
        if: steps.pub_get.outcome == 'success'
        run: flutter analyze --fatal-infos

      - name: Run tests
        if: steps.pub_get.outcome == 'success'
        run: flutter test --coverage

      - name: Build APK (debug)
        if: steps.pub_get.outcome == 'success'
        run: flutter build apk --flavor appDev --debug

      - name: Skipped flutter steps notice
        if: steps.pub_get.outcome != 'success'
        run: |
          echo "::warning::Flutter analyze/test/build skipped — omds path dep (../omds-flutter/omds_library) unavailable in CI."
          echo "Fix: configure secrets.OMDS_FLUTTER_PAT in olivium-dev org or publish omds@0.0.3 to pub.fds-4.site."
