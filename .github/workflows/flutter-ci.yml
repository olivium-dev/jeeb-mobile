name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout omds-flutter sibling for path dep
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_omds
        with:
          repository: olivium-dev/omds-flutter
          path: __omds_checkout
          token: ${{ secrets.OMDS_FLUTTER_PAT || secrets.GITHUB_TOKEN }}

      - name: Move omds-flutter into expected sibling path
        if: steps.checkout_omds.outcome == 'success'
        run: mv "$GITHUB_WORKSPACE/__omds_checkout" "$(dirname "$GITHUB_WORKSPACE")/omds-flutter"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        id: pub_get
        run: flutter pub get

      - name: Analyze
        # `dart analyze` avoids the `flutter analyze` exit-code-64 crash that
        # happens while bootstrapping native-assets in CI. --fatal-infos keeps
        # the prior strictness.
        run: dart analyze --fatal-infos .

      - name: Run tests
        run: flutter test --coverage

      - name: Run dev Firebase gate shell tests
        run: |
          bash tool/test_validate_dev_google_services.sh
          bash tool/test_run_msi_dual_preflight.sh

      - name: Coverage summary (lcov)
        # Surfaces aggregate line coverage from coverage/lcov.info produced above.
        # Raise the failure threshold here once a baseline is agreed (e.g. add
        # `lcov --fail-under-lines <N> lcov.info`).
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info

      - name: Inject and validate dev Firebase config
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DEV_GOOGLE_SERVICES_JSON_B64: ${{ secrets.DEV_GOOGLE_SERVICES_JSON_B64 }}
          DEV_FIREBASE_EXPECTED_PROJECT_NUMBER: ${{ secrets.DEV_FIREBASE_EXPECTED_PROJECT_NUMBER }}
          DEV_FIREBASE_EXPECTED_PROJECT_ID: ${{ secrets.DEV_FIREBASE_EXPECTED_PROJECT_ID }}
          DEV_FIREBASE_EXPECTED_APP_ID: ${{ secrets.DEV_FIREBASE_EXPECTED_APP_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DEV_GOOGLE_SERVICES_JSON_B64:-}" ||
                -z "${DEV_FIREBASE_EXPECTED_PROJECT_NUMBER:-}" ||
                -z "${DEV_FIREBASE_EXPECTED_PROJECT_ID:-}" ||
                -z "${DEV_FIREBASE_EXPECTED_APP_ID:-}" ]]; then
            echo "::error::Protected dev Firebase config and expected identity inputs are required"
            exit 1
          fi
          umask 077
          printf '%s' "${DEV_GOOGLE_SERVICES_JSON_B64}" \
            | base64 --decode > android/app/src/dev/google-services.json
          chmod 600 android/app/src/dev/google-services.json
          bash tool/validate_dev_google_services.sh

      - name: Skip dev FCM APK for fork PR
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          echo "PR analysis and tests passed; dev FCM APK build is safely skipped
          because protected Firebase inputs are unavailable to pull requests."

      - name: Build APK (debug)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: >-
          flutter build apk --flavor dev --debug
          --dart-define=REQUIRE_REAL_PUSH=true
