name: jeeb_mobile
description: Jeeb mobile app — Flutter + Clean Architecture + flutter_bloc.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.8 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Olivium Material Design System (OMDS) — local path during MVP, pub.fds-4.site after publish.
  omds:
    path: ../omds-flutter/omds_library

  # Olivium Flutter Library — geo capture (`ofl_geo_capture`, AKA
  # geocapture-flutter in JEEB-BOUNDARIES.md / REUSE-MAP.md). The location
  # picker delegates GPS + map-pin to this package. The dep is added once the
  # package is published to pub.fds-4.site; until then a local pubspec_overrides
  # entry handles the path. The feature itself sits behind a port
  # (`MapPickerLauncher`) so the cubit and screen don't import the package
  # directly — the DI container provides the geocapture-backed adapter.

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Functional programming
  dartz: ^0.10.1

  # Dependency injection (versions aligned with OMDS)
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking
  dio: ^5.4.0

  # WebSocket transport for the chat realtime channel (T-mobile-017). Wraps
  # `dart:io` `WebSocket` + `dart:html` `WebSocket` behind a single Stream/Sink
  # interface so the same cubit code works on mobile and web targets.
  web_socket_channel: ^3.0.1

  # Routing
  go_router: ^13.0.0

  # UI / Design System support
  google_fonts: ^6.2.1

  # Vector brand artwork (splash wordmark, node 56572:1711). Ships transitively
  # via OMDS today; pinned explicitly so the `SvgPicture.asset` import in
  # branded_splash.dart isn't load-bearing on OMDS's dependency graph (same
  # rationale as `crypto` below). Version matches omds_library (^2.0.10+1).
  flutter_svg: ^2.0.10+1

  # Lottie vector animations (motion wave, 2026-08-03). The brand's motion is
  # "functional and gentle" — fades and short slides, no bounce, no decorative
  # loops — which the 10 hand-authored compositions in assets/animations/ encode.
  # SDK-PIN — EXACT, not a caret range (same discipline as `record` 6.x and
  # `google_maps_flutter` 2.17.1 above). 3.3.1 declares sdk ^3.6.0 /
  # flutter >=3.27.0, satisfied by this app's Dart 3.10.8 floor and CI's
  # Flutter 3.38.9. **`^3.3.1` resolves to 3.5.1 on a dev machine running
  # Flutter 3.44**, and 3.5.1 requires sdk ^3.12.0 / flutter >=3.44.0 — which
  # builds locally and then fails CI. Pub solves against the LOCAL SDK, not the
  # declared floor, so only an exact pin is safe here. Raise it when CI moves.
  # Shape layers only — the assets carry no images, fonts or expressions, so
  # nothing resolves at runtime.
  lottie: 3.3.1

  # URL launcher — used by active-delivery screen (T-MOB-031) to open Google
  # Maps / Waze deep-link and by share-PDF flow (T-MOB-032).
  url_launcher: ^6.3.0

  # Open files from device storage — used by settlement PDF download (T-MOB-032)
  # to trigger the OS share sheet after the file is saved to the cache dir.
  open_file: ^3.3.2

  # Temporary directory access — used by settlement PDF download to write the
  # file before passing it to open_file (T-MOB-032).
  path_provider: ^2.1.4

  # Voice-request recorder (T-MOB-011). `record` owns microphone capture to a
  # temp file (AAC-LC / m4a) and the RECORD_AUDIO runtime-permission prompt via
  # `hasPermission()`; `audioplayers` streams the captured file back for the
  # preview/playback row. Both are wrapped behind the `VoiceRecorder` /
  # `VoicePlayer` ports so the cubit, screen, and tests stay platform-free
  # (the in-memory Fake* impls remain the unit-test seam). 6.x lines are pinned
  # because record 7.x requires Dart >=3.12 / Flutter >=3.44 (this app is on
  # Dart 3.10.8 / Flutter 3.38.9).
  record: ^6.2.1
  audioplayers: ^6.7.1

  # Maps + GPS for the map screens (T-MOB-012 drop-off pin capture +
  # T-MOB-017 live tracking). `google_maps_flutter` is the app-facing facade
  # that renders the courier puck + route polyline on the order-tracking
  # surface (TrackingMapSurface) and the drop-off picker; `geolocator` owns the
  # device GPS fix + runtime location-permission prompt for the "centre on me"
  # button. Both sit behind the `MapPickerLauncher` / `GeocaptureGateway` ports
  # so the cubits/screens never import the plugins directly — the Fakes stay
  # the unit-test seam and `dart analyze` stays green without a key. The Android
  # Maps key is injected via the ${MAPS_API_KEY} manifest placeholder and the
  # iOS key via AppDelegate / Info.plist (never committed).
  #
  # Release resolution is pinned by the tracked pubspec.lock under Flutter
  # 3.44.2 / Dart 3.12.2. Keep the explicit Android implementation constraint
  # until a map-rendering regression pass approves a federated-plugin upgrade;
  # pubspec.lock currently resolves 2.19.10 and the iOS graph resolves 2.18.4.
  google_maps_flutter: 2.17.1
  google_maps_flutter_android: ">=2.19.9 <2.19.11"
  geolocator: ^14.0.0

  # Image capture/selection for proof-of-delivery + profile-avatar flows
  # (Sprint 1 Stream B). Intended to sit behind a port so the cubits/screens
  # stay platform-free.
  image_picker: ^1.1.2

  # F5: square-crop step behind PhotoCropperService (pattern only, not
  # rahmah-fe's version/keys). Flutter 3.44 integrates this plugin through
  # SwiftPM, whose canonical Package.resolved owns TOCropViewController 3.2.0;
  # CocoaPods must not declare or patch TOCropViewController.
  image_cropper: 12.2.1

  # F5: explicit pin for CachedNetworkImage.evictFromCache (already transitive
  # via omds' OmdsCachedImage) — the avatar cache-bust seam.
  cached_network_image: ^3.4.1

  # P4/P5 (b01-20260725): Android 13+ SYSTEM Photo Picker opt-in
  # (ACTION_PICK_IMAGES) — see the `useAndroidPhotoPicker` toggle in
  # `injection_container.dart`. Without it the plugin falls back to the legacy
  # Documents UI, which raises ActivityNotFoundException →
  # PhotoPickFailure.unavailable on GMS-less / OEM images. This PINS a package
  # that is ALREADY resolved transitively (image_picker_android) — it pulls in
  # no new native module, and adds no manifest permission (ACTION_PICK_IMAGES
  # needs none).
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0

  # Internationalisation
  intl: ^0.20.2

  # Persistence (used by LocaleCubit + RoleCubit)
  shared_preferences: ^2.3.3

  # Privacy-gated product analytics. The SDK is isolated behind the Clarity
  # domain port and remains disabled unless a release build explicitly supplies
  # the enable flag, a project ID, and privacy approval. Exact pin: 1.9.0 raises
  # the supported Flutter floor to 3.32.0 / Dart 3.8.
  clarity_flutter: 1.9.0

  # Crash & non-fatal reporting (T-mobile-049). firebase_core must be
  # initialized before FirebaseCrashlytics is touched — see
  # lib/app/bootstrap.dart and the FlutterFire setup in docs/observability/.
  # D3: <3.15.0 remains load-bearing because 3.15.0/3.15.1 combine the older
  # platform-interface constraint with the newer namespaced Android channels.
  # The tracked lock resolves the aligned FlutterFire 3.14.0 generation below;
  # CI uses `flutter pub get --enforce-lockfile` to prevent graph drift.
  firebase_core: ">=3.13.1 <3.15.0"
  firebase_crashlytics: ^4.1.3

  # Push notifications (T-mobile-032). firebase_messaging owns the FCM/APNs
  # transport; flutter_local_notifications renders a heads-up notification
  # for Android foreground messages — FCM doesn't surface those by default
  # on Android, while iOS handles them via setForegroundNotificationPresentationOptions.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Realtime chat transport (b02 — "the mobile subscribes, the backend only
  # writes"). `cloud_firestore` opens ONE `.snapshots()` listener per open chat
  # thread over `Conversations/{id}/Messages`, which the chat-service already
  # writes (`FirestoreConversationStore.AddMessageAsync`). This is a STREAM, not
  # a poll: no `Timer`, no interval, no repeated request — the server pushes each
  # document down the open channel. It replaces the push→refetch path, whose cost
  # was one full `GET /v1/conversations/{id}/messages` per inbound message.
  #
  # PROJECT: Jeeb's OWN Firebase project, `jeeb-5a293`. `Firebase.initializeApp()`
  # takes it from `android/app/google-services.json` (and the `dev` flavor copy),
  # both of which read `project_id: jeeb-5a293`. Jeeb must NEVER point at
  # `alrahmah-d7a33` — chat history written there once caused a live outage.
  #
  # `firebase_auth` is here because a Firestore read needs an IDENTITY the
  # security rules can key on. See `ChatFirebaseIdentity` — the app signs in with
  # a CUSTOM TOKEN minted from the Jeeb JWT; it never signs in anonymously and
  # never reads unauthenticated. Keep the exact 5.6.0 pin aligned with the
  # FlutterFire 3.14.0 bill of materials used by firebase_core 3.14.0,
  # firebase_messaging 15.2.7, firebase_crashlytics 4.3.7, and
  # cloud_firestore 5.6.9. Mixing firebase_auth 5.4.2 (FlutterFire Swift shared
  # package 3.11.0) with those 3.14.0 plugins makes Xcode dependency resolution
  # fail before compilation.
  cloud_firestore: ^5.6.5
  firebase_auth: 5.6.0

  # Hashing for the fallback PIN store (T-mobile-005). crypto already
  # ships transitively via flutter; pinning it explicitly so the import is
  # not load-bearing on someone else's dependency graph.
  crypto: ^3.0.3

  # Native social sign-in (T-mobile-003). sign_in_with_apple drives the
  # AuthenticationServices sheet on iOS and a Safari-tab JS fallback on
  # Android; google_sign_in drives the GMS account picker on Android and
  # the native sheet on iOS. Both surface an ID token that the
  # auth-service /api/jeeb/auth/social endpoint validates against Apple/
  # Google JWKS.
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.1

  # Secure persistence for the JWT minted by jeeb-gateway after a social
  # sign-in (T-mobile-003). Backed by Keychain on iOS and EncryptedSharedPreferences
  # on Android.
  flutter_secure_storage: ^9.2.2

  # Real on-device unlock (JEBV4-213 / E18, Q-077). local_auth drives the OS
  # biometric dialog (Face ID / fingerprint) via the platform's BiometricPrompt
  # / LAContext. LocalAuthBiometricGateway wraps it behind the existing
  # `BiometricGateway` port so the `/lock` screen + BiometricLockCubit stay
  # plugin-agnostic. authenticate() is called with `biometricOnly: false` so the
  # OS offers the device credential (PIN / pattern / password) as the fallback
  # when no biometric is enrolled (the DoD emulator path). Android additionally
  # requires the host Activity to be a FlutterFragmentActivity (see MainActivity)
  # and the USE_BIOMETRIC permission (see AndroidManifest). Debug builds keep the
  # deterministic DevBiometricGateway (emulator/CI seam), so this plugin is only
  # on the release code path.
  local_auth: ^2.3.0

  # Diagnostics persistence + export (diag-persistence lane). share_plus drives
  # the platform share sheet that exports the on-device `[jeeb-diag]` JSONL
  # session files from the dev-only Settings → Diagnostics screen;
  # device_info_plus stamps the device model into each session-file header.
  # Both are runtime-inert in release: every call site is gated on
  # `Diag.enabled` (kDebugMode || JEEB_DIAG dart-define), so a release build
  # never touches either plugin. 10.x/11.x pinned for this app's SDK floor
  # (Dart 3.10.8 / Flutter 3.38.9 — same discipline as `record` above).
  share_plus: ^10.1.2
  device_info_plus: ^11.5.0
  in_app_review: ^2.0.12

  # Reconnect self-heal. The chat `/chat/:id` resolution error state was merged
  # claiming it "SELF-HEALS on reconnect"; an independent tester falsified that
  # — the heal was the retry backoff's phase happening to tick, and a source
  # scan found ZERO connectivity subscribers in lib/ (no `connectivity_plus`,
  # `onConnectivityChanged`, `ConnectivityResult`, `checkConnectivity`,
  # `InternetAddress.lookup`, `internet_connection_checker` or
  # `network_info_plus`) and no such package here. Nothing was listening.
  #
  # This is the ONLY source of a genuine OS-level offline->online event in
  # Flutter — the framework exposes no such stream — and it is confined to ONE
  # adapter (`core/network/connectivity_reachability_source.dart`) behind the
  # plain-`Stream<bool>` port `NetworkReachabilitySignals`, so no cubit, screen
  # or test imports it (same discipline as geolocator/local_auth/record).
  # Adds the NORMAL permission ACCESS_NETWORK_STATE (no runtime prompt) and no
  # first-party native code. Runtime-defensive by construction: if the platform
  # channel is unavailable the bus simply never emits, and every consumer keeps
  # the bounded backoff it already had. 7.0.0 declares sdk >=3.2.0 / flutter
  # >=3.7.0, comfortably inside this app's floor (Dart 3.10.8 / Flutter 3.38.9).
  # Exact pin: 7.1.0+ reads the iOS 26-only NWPath.isUltraConstrained API and
  # cannot compile with this repository's Xcode 15.4 toolchain.
  connectivity_plus: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.1
  injectable_generator: ^2.4.1
  build_runner: ^2.5.4
  # Drives deterministic virtual time in chat reconnect/backoff cubit tests
  # (chat_connection_cubit_test.dart). Ships transitively with flutter_test but
  # imported directly, so declared explicitly per depend_on_referenced_packages.
  fake_async: ^1.3.3
  # JEBV4-213 (E18): the biometric-gateway test fakes LocalAuthPlatform.instance
  # (the "fake auth channel") to drive LocalAuthBiometricGateway without a real
  # device. Both ship transitively via local_auth but are imported directly, so
  # declared explicitly per depend_on_referenced_packages.
  local_auth_platform_interface: ^1.1.0
  plugin_platform_interface: ^2.1.8
  # Provides StreamChannelMixin for the in-memory WebSocketChannel fake in
  # live_realtime_chat_socket_test.dart. Ships transitively with
  # web_socket_channel but imported directly, so declared explicitly per
  # depend_on_referenced_packages.
  stream_channel: ^2.1.4
  sqflite_common_ffi: ^2.3.0

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - lib/l10n/app_en.arb
    - lib/l10n/app_ar.arb
    # Jeeb brand wordmark (Figma node 56572:1821 "Group 68"). Exported once
    # from the Figma Dev Mode MCP; rendered on the splash via SvgPicture.asset.
    - assets/brand/jeeb_logo.svg
    # MIDNIGHT M5 — deleted here: empty_orders.png and the three 300x300
    # onboarding_*.svg walkthrough vectors. All four had zero importers (M2-21
    # drew the walkthrough art, M1's JeebEmptyState replaced the PNG) and all
    # four are light-theme art: the SVGs ink their structure in #0B1351 (1.11:1
    # on the field) over retired #EAE7EB/#E5E1E5 surfaces.

    # Lottie motion set (docs/redesign-2026-08/08-MOTION-SPEC.md). Registered
    # individually rather than as a directory so an unreferenced file cannot
    # silently inflate the bundle. Surface + RTL notes live in 09-MOTION-VALIDATION.md.
    # NOT registered (deliberate): courier-in-transit.json and onboarding-say-it.json.
    # Both are authored and validated but unplayable today — the first needs a courier
    # position the gateway does not provide, and the second would replace real localized
    # Arabic copy with placeholder bars (Lottie carries no fonts). Kept on disk, out of
    # the bundle; re-register when the data exists rather than re-authoring them.
    # MIDNIGHT M5 DELETED broadcasting / mic-listening / nearby-scan / voice-waveform
    # outright: M2 replaced all four with drawn primitives (the radar empty state,
    # jHalo / jDash / jWave), leaving zero loaders. Dead weight, not held art.
    - assets/animations/empty-say-it.json
    - assets/animations/kyc-review.json
    - assets/animations/loading-dots.json
    - assets/animations/success-check.json

    # MIDNIGHT M0-7 — board artwork imported from the Rich UI export
    # (`export-rich-ui/assets/`), renamed to this repo's snake_case convention.
    #   jeeb_wordmark.svg -> the Rich UI wordmark lockup (distinct from
    #                        jeeb_logo.svg above, which is the Figma splash mark)
    #   delivery_3d.png   -> 3D hand/phone/shopping-bag hero
    # M5 VETTED delivery_3d.png and de-registered it: zero importers, mean HLS
    # saturation .735 in cyan/magenta/pink, and pixel-identical to the deleted
    # empty_orders.png at 342x347. §2.7 forbids stock art, so it must be redrawn
    # rather than recoloured. Kept on disk (board import) pending the owner's call.
    - assets/brand/jeeb_wordmark.svg

    # MIDNIGHT M0-6 — the dark Google Maps style JSON. Google Maps renders its
    # LIGHT default until a style is applied, which on a #070C33 screen reads as
    # a white hole; this re-values the base map into the Midnight palette
    # measured off the R3/R11 board tiles. Loaded via `JeebMapStyle`
    # (lib/core/map/jeeb_map_style.dart) and passed to `GoogleMap.style`.
    - assets/map_styles/midnight.json
  # Inter, bundled locally (OFL-1.1) as discrete STATIC instances. A single
  # variable TTF registered under discrete `weight:` keys does NOT engage the
  # weight axis — Flutter renders 400/500/600/700 identically (proven by
  # test/inter_font_weight_test.dart, TL-4). Static instances guarantee distinct
  # weights on every platform, including low-end Android. Bundling (rather than
  # fetching via google_fonts) is what makes every branded screen render on a
  # no-egress device — google_fonts' runtime fetch throws a HandshakeException
  # on devices with no path to fonts.gstatic.com, which previously crashed the
  # theme build on first frame. See AppTheme + Bootstrap.minimal.
  # Static instances from the official Inter v4.1 release (rsms/inter).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        # MIDNIGHT M0-5: w800 previously degraded to w700, which erased the
        # money emphasis the ramp's statHero/statDisplay/price/badge/codeInput
        # styles depend on (token sheet §6). Static ExtraBold instance from the
        # Google Fonts TTF endpoint (Inter v20) — verified static (no `fvar`),
        # OS/2 usWeightClass 800, unitsPerEm 2048 and hhea/typo metrics
        # identical to the four instances above, so it shares their baseline.
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # MIDNIGHT M0-5: the Arabic brand face. The board's design system declares
    # `--font-arabic: "Baloo Bhaijaan 2", "Inter", "SF Arabic", sans-serif`
    # (_ds/tokens/typography.css:10) — Inter carries no Arabic, so before this
    # every Arabic string fell through to the platform face and the brand
    # simply did not render in AR. The type ramp names this family in
    # `fontFamilyFallback`, so the string below must stay EXACTLY
    # "Baloo Bhaijaan 2" (spaces included) — a fallback family name is matched
    # verbatim and fails SILENTLY, with no analyzer or test to catch a typo.
    # OFL-1.1. Static instances (no `fvar`), usWeightClass 500/600/700 — same
    # discipline as Inter above; 400/800 are deliberately absent because the
    # ramp only ever asks Arabic for w500/w600/w700.
    - family: Baloo Bhaijaan 2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooBhaijaan2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
