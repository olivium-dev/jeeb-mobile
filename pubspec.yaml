name: jeeb_mobile
description: Jeeb mobile app — Flutter + Clean Architecture + flutter_bloc.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.8 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Olivium Material Design System (OMDS) — local path during MVP, pub.fds-4.site after publish.
  omds:
    path: ../omds-flutter/omds_library

  # Olivium Flutter Library — geo capture (`ofl_geo_capture`, AKA
  # geocapture-flutter in JEEB-BOUNDARIES.md / REUSE-MAP.md). The location
  # picker delegates GPS + map-pin to this package. The dep is added once the
  # package is published to pub.fds-4.site; until then a local pubspec_overrides
  # entry handles the path. The feature itself sits behind a port
  # (`MapPickerLauncher`) so the cubit and screen don't import the package
  # directly — the DI container provides the geocapture-backed adapter.

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Functional programming
  dartz: ^0.10.1

  # Dependency injection (versions aligned with OMDS)
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking
  dio: ^5.4.0

  # WebSocket transport for the chat realtime channel (T-mobile-017). Wraps
  # `dart:io` `WebSocket` + `dart:html` `WebSocket` behind a single Stream/Sink
  # interface so the same cubit code works on mobile and web targets.
  web_socket_channel: ^3.0.1

  # Routing
  go_router: ^13.0.0

  # UI / Design System support
  google_fonts: ^6.2.1

  # Vector brand artwork (splash wordmark, node 56572:1711). Ships transitively
  # via OMDS today; pinned explicitly so the `SvgPicture.asset` import in
  # branded_splash.dart isn't load-bearing on OMDS's dependency graph (same
  # rationale as `crypto` below). Version matches omds_library (^2.0.10+1).
  flutter_svg: ^2.0.10+1

  # Internationalisation
  intl: ^0.20.2

  # Persistence (used by LocaleCubit + RoleCubit)
  shared_preferences: ^2.3.3

  # Crash & non-fatal reporting (T-mobile-049). firebase_core must be
  # initialized before FirebaseCrashlytics is touched — see
  # lib/app/bootstrap.dart and the FlutterFire setup in docs/observability/.
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3

  # Push notifications (T-mobile-032). firebase_messaging owns the FCM/APNs
  # transport; flutter_local_notifications renders a heads-up notification
  # for Android foreground messages — FCM doesn't surface those by default
  # on Android, while iOS handles them via setForegroundNotificationPresentationOptions.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Hashing for the fallback PIN store (T-mobile-005). crypto already
  # ships transitively via flutter; pinning it explicitly so the import is
  # not load-bearing on someone else's dependency graph.
  crypto: ^3.0.3

  # Native social sign-in (T-mobile-003). sign_in_with_apple drives the
  # AuthenticationServices sheet on iOS and a Safari-tab JS fallback on
  # Android; google_sign_in drives the GMS account picker on Android and
  # the native sheet on iOS. Both surface an ID token that the
  # auth-service /api/jeeb/auth/social endpoint validates against Apple/
  # Google JWKS.
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.1

  # Secure persistence for the JWT minted by jeeb-gateway after a social
  # sign-in (T-mobile-003). Backed by Keychain on iOS and EncryptedSharedPreferences
  # on Android.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.1
  injectable_generator: ^2.4.1
  build_runner: ^2.5.4

flutter:
  uses-material-design: true

  assets:
    - lib/l10n/app_en.arb
    - lib/l10n/app_ar.arb
    # Jeeb brand wordmark (Figma node 56572:1821 "Group 68"). Exported once
    # from the Figma Dev Mode MCP; rendered on the splash via SvgPicture.asset.
    - assets/brand/jeeb_logo.svg
    # Client-home zero-orders hero illustration ("shop (1) 1", Figma node
    # 56611:18663, aspect 743/756). Exported from the Figma Dev Mode MCP.
    - assets/illustrations/empty_orders.png
    # Sample peer avatar for the debug-only JEEB_DEV_CHAT capture seam so the
    # chat header renders the Figma's circular bitmap avatar deterministically
    # offline. Production binds the real cdn-service url; this asset is only
    # referenced by DevChatPreviewScreen (kDebugMode-gated, inert in release).
    - assets/dev/peer_avatar_sample.jpg

  # Inter, bundled locally (OFL-1.1). This is a SINGLE variable font that
  # covers the whole weight axis; we map the discrete weights Material 3 asks
  # for (400/500/600/700) to the same file so Flutter selects the right axis
  # instance per `fontWeight`. Bundling Inter (rather than fetching it at
  # runtime via google_fonts) is what makes every branded screen render on a
  # no-egress device — google_fonts' runtime fetch throws a HandshakeException
  # on devices with no path to fonts.gstatic.com, which previously crashed the
  # theme build on first frame. See AppTheme + Bootstrap.minimal.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
