# Jeeb mobile — minimal smoke flow.
#
# Purpose: cold-launch the app and prove it reaches the foreground without
# crashing. The cheapest possible "is the app alive" gate; expand into real
# page-object subflows (see maestro-page-object-via-runflow skill) afterwards.
#
# appId notes:
#   release / production flavor  -> app.jeeb.mobile
#   debug build (flutter run)    -> app.jeeb.mobile.dev   (dev flavor adds .dev suffix)
#   staging                      -> app.jeeb.mobile.staging
# Run with:  maestro test -e APP_ID=app.jeeb.mobile.dev .maestro/smoke.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true            # AP-4 fix: no state bleed between runs
- takeScreenshot: jeeb_cold_launch   # captures the onboarding "Voice-first deliveries" screen
