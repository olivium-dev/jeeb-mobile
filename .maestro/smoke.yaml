# Jeeb mobile — compatibility smoke alias.
#
# The structured Android mock smoke suite now lives under:
#   .maestro/flows/smoke/
#
# appId notes:
#   release / production flavor  -> app.jeeb.mobile
#   debug build (flutter run)    -> app.jeeb.mobile.dev   (dev flavor adds .dev suffix)
#   staging                      -> app.jeeb.mobile.staging
# Run with:
#   maestro test -e APP_ID=app.jeeb.mobile.dev \
#     -e JEEB_MOCK_BASE_URL=http://10.0.2.2:3055 \
#     --debug-output "/Volumes/Extreme Pro/claude-jeeb/jeeb-mobile-orchestrator/maestro-debug" \
#     .maestro/smoke.yaml
#
# Static contract: Android accepts jeeb.mock_base_url and the app exports the
# onboarding Semantics identifiers asserted below.
appId: ${APP_ID}
tags:
  - android
  - smoke
  - mock
  - cold-launch
  - critical
env:
  LOCALE: en
  JEEB_MOCK_BASE_URL: "http://10.0.2.2:3055"
---
- launchApp:
    stopApp: true
    clearState: true
    arguments:
      jeeb.locale: "${LOCALE}"
      jeeb.mock_base_url: "${JEEB_MOCK_BASE_URL}"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "onboarding_next_button"
    timeout: 20000
- assertVisible:
    id: "onboarding_skip_button"
- takeScreenshot: "smoke_00_cold_launch_onboarding"
