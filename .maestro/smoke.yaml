# Jeeb mobile — minimal smoke flow.
#
# Purpose: cold-launch the app and prove it reaches the foreground without
# crashing. The cheapest possible "is the app alive" gate; expand into real
# page-object subflows (see maestro-page-object-via-runflow skill) afterwards.
#
# appId notes:
#   release / production flavor  -> app.jeeb.mobile
#   debug build (flutter run)    -> app.jeeb.mobile.dev   (dev flavor adds .dev suffix)
#   staging                      -> app.jeeb.mobile.staging
# Run with:  maestro test -e APP_ID=app.jeeb.mobile.dev .maestro/smoke.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true            # AP-4 fix: no state bleed between runs
- takeScreenshot: jeeb_cold_launch   # captures the onboarding "Voice-first deliveries" screen
#
# ── UNBLOCKED: content assertion (semantics export landed Phase 2) ────────────
# Foundation enabled the Flutter semantics tree at boot
# (`SemanticsBinding.instance.ensureSemantics()` in lib/main.dart) and the
# onboarding CTA now carries `Semantics(identifier: 'onboarding_next_button')`
# (lib/features/onboarding/presentation/onboarding_screen.dart). Verified with
# `maestro hierarchy`: the node now exposes resource-id "onboarding_next_button"
# with accessibilityText "Next" and clickable=true (was empty before the fix).
#
# The assertion is keyed on the stable `id` (i18n-safe, AP-5), never visible
# text, and waits long enough to clear cold-start + the ~1.3s branded-splash
# floor (AP-3).
- extendedWaitUntil:
    visible:
      id: "onboarding_next_button"
    timeout: 15000
