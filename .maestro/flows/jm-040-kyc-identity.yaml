# ─────────────────────────────────────────────────────────────────────────────
# JM-040 — KYC Identity (remove Vehicle step, D20) + chain to funding
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given the KYC wizard, Then NO vehicle step (kyc_vehicle_step must NOT
#        be visible anywhere in the wizard) [D20].
#   AC2: Gov-ID front/back upload and selfie steps present:
#        kyc_id_front_upload, kyc_id_back_upload, kyc_selfie_upload.
#   AC3: Chained from service-area correctly (kyc_wizard_root visible after
#        dm_onboarding_continue from service-area step).
#   AC4: kyc_submit_cta → onboarding-funding [JM-041]
#        (funding_explainer or funding_continue_cta visible). NOT the
#        standalone status view directly.
#
# Mock:
#   GET /form-builder-service/v1/templates/jeeb_jeeber_v1
#   POST /form-builder-service/v1/templates/jeeb_jeeber_v1/submit
#   POST /user-management/users/:userId/kyc-link
# Seam:
#   jeeb.seam.session=jeeber_logged_in + jeeb.seam.kyc_status=none
#   + jeeb.seam.journey=jeeber_onboarding_at_kyc   ← NEW seam value (FLAG)
#   (Pins the wizard at the kyc-identity step so the full onboarding navigation
#    chain from AC3 doesn't need to be re-driven; alternatively use route pin
#    jeeb.route=/profile/kyc?step=id — FLAG for seam owner)
#
# NEW SEAM KEYS REQUIRED:
#   jeeb.seam.kyc_status (see JM-036)
#   jeeb.seam.journey value "jeeber_onboarding_at_kyc" — seeds the mock so the
#     KYC wizard is reachable and kyc_submit_cta posts to the mock KYC endpoint
#     (depends on mock-fix K1: gateway path reconcile).
#
# STATUS: RED until JM-040 ships + K1 mock-fix + jeeb.seam.kyc_status seed
#         exist (test-first). Decisions: D20, D52, D67.
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-040-kyc-identity.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── Navigate through full onboarding chain to reach KYC wizard ───────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "jeeber_logged_in"
      jeeb.seam.kyc_status: "none"

- extendedWaitUntil:
    visible:
      id: "shell_tab_dashboard"
    timeout: 30000

- tapOn:
    id: "shell_tab_dashboard"

- extendedWaitUntil:
    visible:
      id: "delivery_register_now_cta"
    timeout: 15000

- tapOn:
    id: "delivery_register_now_cta"

# photo step → personal-details
- extendedWaitUntil:
    visible:
      id: "dm_onboarding_continue"
    timeout: 15000

# The photo step REQUIRES a profile photo before Continue is enabled
# (dm_onboarding_photo_step.dart `enabled: state.hasPhoto`); pick one via the
# media sheet so the wizard advances to the address step.
- tapOn:
    id: "dm_onboarding_photo_upload_area"
- extendedWaitUntil:
    visible:
      text: "Camera"
    timeout: 8000
- tapOn:
    text: "Camera"

- tapOn:
    id: "dm_onboarding_continue"

# personal-details → service-area
- extendedWaitUntil:
    visible:
      id: "dm_onboarding_address_root"
    timeout: 15000

- tapOn:
    id: "dm_onboarding_address_state_field"
- inputText: "TestState"
- tapOn:
    id: "dm_onboarding_address_country_field"
- inputText: "TestCountry"
- tapOn:
    id: "dm_onboarding_address_street_field"
- inputText: "TestStreet"
- tapOn:
    id: "dm_onboarding_address_field"
- inputText: "TestAddress"
- tapOn:
    id: "dm_onboarding_continue"

# service-area → kyc-identity
- extendedWaitUntil:
    visible:
      id: "dm_onboarding_service_area_root"
    timeout: 15000

# The service-area Continue is gated on a pinned home base
# (dm_onboarding_service_area_step.dart `enabled: state.hasHomeBase`). Pin one
# via the location picker (select → confirm pin) so Continue is enabled and the
# wizard chains to the KYC identity step — mirrors JM-038's home-base pin.
- tapOn:
    id: "service_area_select_location"
- extendedWaitUntil:
    visible:
      id: "capture_location_pin_cta"
    timeout: 15000
- tapOn:
    id: "capture_location_pin_cta"
- extendedWaitUntil:
    visible:
      id: "dm_onboarding_service_area_root"
    timeout: 15000

- tapOn:
    id: "dm_onboarding_continue"

# ── AC3: kyc_wizard_root visible after chain from service-area ─────────────
- extendedWaitUntil:
    visible:
      id: "kyc_wizard_root"
    timeout: 15000

- takeScreenshot: jm040_ac3_kyc_wizard_chained_from_service_area

# ── AC1: No vehicle step visible ──────────────────────────────────────────────
- assertNotVisible:
    id: "kyc_vehicle_step"

- takeScreenshot: jm040_ac1_no_vehicle_step

# ── AC2: Gov-ID + selfie steps present ───────────────────────────────────────
- assertVisible:
    id: "kyc_id_front_upload"

- assertVisible:
    id: "kyc_submit_cta"

- takeScreenshot: jm040_ac2_id_and_selfie_present

# ── AC4: kyc_submit_cta → onboarding-funding (not standalone status view) ────
# (Proof-photo uploads are device interactions not drivable in Maestro without
#  a real camera; we assert the submit CTA is present and tap it. The mock
#  accepts the KYC submission and the app chains to onboarding-funding.)
- tapOn:
    id: "kyc_submit_cta"

- extendedWaitUntil:
    visible:
      id: "funding_explainer"
    timeout: 20000

- takeScreenshot: jm040_ac4_submit_chains_to_funding
