# ─────────────────────────────────────────────────────────────────────────────
# JM-055 — Wallet Activity List (typed ledger)
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given the ledger, Then wallet_activity_row_<id> typed rows
#        (Reserve / Fee-won / Released / Refund / Penalty / Top up / Gift)
#        show amount + sign + icon + ref; wallet_activity_root visible.
#   AC2: Infinite scroll skeleton (wallet_activity_skeleton) shown while
#        loading [D73].
#   AC3: Tap wallet_activity_row_<id> → transaction-detail
#        (txn_detail visible) [JM-056].
#   AC4: Empty state (wallet_activity_empty) shown when ledger is empty.
#
# Mock:
#   GET /wallet-service/v1/jeeb/wallet/ledger  (mock-fix W2m — define; paginated
#     typed rows; must be seeded by jeeb.seam.journey=jeeber_wallet_ledger)
# Seam:
#   AC1/2/3: jeeb.seam.session=jeeber_logged_in
#            + jeeb.seam.kyc_status=approved
#            + jeeb.seam.wallet_state=sufficient
#            + jeeb.seam.journey=jeeber_wallet_ledger  ← NEW W3 seed (see below)
#            + jeeb.route=/wallet/activity
#   AC4 (empty): jeeb.seam.session=jeeber_logged_in
#                + jeeb.seam.kyc_status=approved
#                + jeeb.seam.wallet_state=sufficient
#                + jeeb.route=/wallet/activity
#                (no ledger seed → empty state)
#
# NEW SEAM KEYS / MOCK SEEDS REQUIRED (W3 test-data contract):
#   jeeb.seam.journey=jeeber_wallet_ledger — seeds ≥2 typed ledger rows for
#     user-jeeber-002 in the mock ledger endpoint (W2m). Stable ids:
#       ledger-row-reserve-001   (Reserve row)
#       ledger-row-fee-001       (Fee-won row)
#       ledger-row-released-001  (Released row)
#   POST /__mock/seed/journey { "journey": "jeeber_wallet_ledger" }
#   Mock-fix W2m: GET /wallet-service/v1/jeeb/wallet/ledger
#     (paginated; returns typed rows with amount/sign/icon/ref/id)
#
# STATUS: RED until JM-055 ships + W2m mock-fix + jeeber_wallet_ledger seed exist.
#         Decisions: D41, D1, D37, D2, D30, D73.
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-055-wallet-activity.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── AC4: Empty state when no ledger rows (FIRST — before any ledger seed) ─────
# Runs FIRST so the mock ledger is genuinely empty (the runner resets the mock
# before the flow; later jeeber_wallet_ledger launches seed rows that persist
# across `clearState`, which only clears APP state, not the mock).
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "jeeber_logged_in"
      jeeb.seam.kyc_status: "approved"
      jeeb.seam.wallet_state: "sufficient"
      jeeb.route: "/wallet/activity"
- extendedWaitUntil:
    visible:
      id: "wallet_activity_root"
    timeout: 30000
- assertVisible:
    id: "wallet_activity_empty"
- takeScreenshot: jm055_ac4_empty_state

# ── AC1: Typed ledger rows visible ────────────────────────────────────────────
# REQUIRES: W2m mock-fix + jeeber_wallet_ledger seed
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "jeeber_logged_in"
      jeeb.seam.kyc_status: "approved"
      jeeb.seam.wallet_state: "sufficient"
      jeeb.seam.journey: "jeeber_wallet_ledger"
      jeeb.route: "/wallet/activity"

- extendedWaitUntil:
    visible:
      id: "wallet_activity_root"
    timeout: 30000

# First seeded row (Reserve type) must be present
- assertVisible:
    id: "wallet_activity_row_ledger-row-reserve-001"

# Fee-won row
- assertVisible:
    id: "wallet_activity_row_ledger-row-fee-001"

- takeScreenshot: jm055_ac1_typed_ledger_rows

# ── AC2: Skeleton shown while loading ─────────────────────────────────────────
# The skeleton renders briefly; assert root and a possible skeleton id.
# The wallet_activity_skeleton may not be assertable after data lands;
# this AC validates that the loading state uses skeleton cards, not a spinner.
# Structural assertion only — the skeleton and root must coexist on first frame.
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "jeeber_logged_in"
      jeeb.seam.kyc_status: "approved"
      jeeb.seam.wallet_state: "sufficient"
      jeeb.seam.journey: "jeeber_wallet_ledger"
      jeeb.route: "/wallet/activity"

- extendedWaitUntil:
    visible:
      id: "wallet_activity_root"
    timeout: 30000

- takeScreenshot: jm055_ac2_activity_list_loaded

# ── AC3: Row tap → transaction-detail ─────────────────────────────────────────
# REQUIRES: W3m mock-fix (txn-by-id) + W2m + jeeber_wallet_ledger seed
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "jeeber_logged_in"
      jeeb.seam.kyc_status: "approved"
      jeeb.seam.wallet_state: "sufficient"
      jeeb.seam.journey: "jeeber_wallet_ledger"
      jeeb.route: "/wallet/activity"

- extendedWaitUntil:
    visible:
      id: "wallet_activity_row_ledger-row-reserve-001"
    timeout: 30000

- tapOn:
    id: "wallet_activity_row_ledger-row-reserve-001"

- extendedWaitUntil:
    visible:
      id: "txn_detail"
    timeout: 15000

- takeScreenshot: jm055_ac3_row_tap_to_txn_detail
