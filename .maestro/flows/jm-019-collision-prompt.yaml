# ─────────────────────────────────────────────────────────────────────────────
# JM-019 — Social/Email Collision Prompt
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given a collision (email already registered via another method), Then
#        social_collision_sheet is visible.
#   AC2: When social_collision_continue_cta tapped → /login
#        (login_email_field visible) [D22].
#   AC3: When social_collision_other_email_cta tapped → sign-up
#        (signup_name_field visible) [D22].
#
# The collision sheet can be triggered from either the sign-up flow (JM-008) or
# the social login flow (JM-018). This flow enters via the social path (reusing
# the seam pattern from jm-018); the sign-up path is covered by jm-008 AC5.
#
# Mock dependencies: 409 response from signup/social (B2/B3). RED until B2/B3 land.
# Governing decisions: D22.
#
# STATUS: RED until JM-019 ships (test-first)
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-019-collision-prompt.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── AC1 + AC2: Collision sheet visible; Continue → /login ────────────────────
# logged_out_returning seeds the login screen; collision_409 makes SocialAuthSeam
# return a 409 when the Facebook CTA is tapped.
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"
      jeeb.seam.social_login: "collision_409"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_social_facebook"

- extendedWaitUntil:
    visible:
      id: "social_collision_sheet"
    timeout: 15000

- takeScreenshot: jm019_ac1_collision_sheet

- tapOn:
    id: "social_collision_continue_cta"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 15000

- takeScreenshot: jm019_ac2_login_after_collision_continue

# ── AC3: Collision sheet → Other email → sign-up ─────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"
      jeeb.seam.social_login: "collision_409"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_social_facebook"

- extendedWaitUntil:
    visible:
      id: "social_collision_sheet"
    timeout: 15000

- tapOn:
    id: "social_collision_other_email_cta"

- extendedWaitUntil:
    visible:
      id: "signup_name_field"
    timeout: 15000

- takeScreenshot: jm019_ac3_signup_after_collision_other_email
