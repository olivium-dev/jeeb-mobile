# ─────────────────────────────────────────────────────────────────────────────
# JM-021 — Verify Recovery Code
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given recovery code entered in verify_code_input, When
#        verify_code_submit_cta tapped, Then route to
#        /set-password?mode=recovery (setpw_new_field visible) [JM-022].
#   AC2: Wrong/expired code shows error (verify_code_error visible).
#   AC3: verify_code_resend_cta re-requests the code (screen stays, input
#        resets/clears — verify_code_input still visible).
#   IMPORTANT: This screen is distinct from phone-OTP — it must NOT anchor a
#   phone number. It is the email-based recovery code screen [D90/D85].
#
# Mock dependencies: recovery-code verify route (B3). RED until B3 lands.
# Governing decisions: D90, D85.
# Mock dev code: RECOVERY=654321 (42 W-1 FLOOR CLOSED) — flow types it directly;
# jeeb.seam.recovery_code seeds nothing (the mock already accepts the dev code).
#
# STATUS: RED until JM-021 ships (test-first)
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-021-verify-code.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── Navigate to /recover/verify via the recover flow ─────────────────────────
# We enter through login → forgot password → submit email → lands on verify screen.

# ── AC1: Correct code → /set-password?mode=recovery ──────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"
      jeeb.seam.recovery_code: "654321"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 90000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- tapOn:
    id: "recover_email_field"
- inputText: "test@jeeb.app"

- tapOn:
    id: "recover_submit_cta"

- extendedWaitUntil:
    visible:
      id: "verify_code_input"
    timeout: 15000

- takeScreenshot: jm021_ac0_verify_code_screen

# Enter the 6-digit recovery code one digit per cell (RC-7 fix: Maestro inputText
# does not distribute across multi-cell OmdsOtpInput). Cell ids:
# verify_code_input_0 .. verify_code_input_5 (added by app engineer RC-7 fix).
# OmdsOtpInput auto-submits on the last digit (onCompleted fires submit()).
- tapOn:
    id: "verify_code_input_0"
- inputText: "6"
- tapOn:
    id: "verify_code_input_1"
- inputText: "5"
- tapOn:
    id: "verify_code_input_2"
- inputText: "4"
- tapOn:
    id: "verify_code_input_3"
- inputText: "3"
- tapOn:
    id: "verify_code_input_4"
- inputText: "2"
- tapOn:
    id: "verify_code_input_5"
- inputText: "1"

- runFlow:
    when:
      visible:
        id: "verify_code_submit_cta"
    commands:
      - tapOn:
          id: "verify_code_submit_cta"

- extendedWaitUntil:
    visible:
      id: "setpw_new_field"
    timeout: 15000

- takeScreenshot: jm021_ac1_set_password_recovery_mode

# ── AC2: Wrong code → error shown ────────────────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"
      jeeb.seam.recovery_code: "654321"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 90000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- tapOn:
    id: "recover_email_field"
- inputText: "test@jeeb.app"

- tapOn:
    id: "recover_submit_cta"

- extendedWaitUntil:
    visible:
      id: "verify_code_input"
    timeout: 15000

# Enter wrong code — one digit per cell (RC-7 fix).
- tapOn:
    id: "verify_code_input_0"
- inputText: "0"
- tapOn:
    id: "verify_code_input_1"
- inputText: "0"
- tapOn:
    id: "verify_code_input_2"
- inputText: "0"
- tapOn:
    id: "verify_code_input_3"
- inputText: "0"
- tapOn:
    id: "verify_code_input_4"
- inputText: "0"
- tapOn:
    id: "verify_code_input_5"
- inputText: "0"

- runFlow:
    when:
      visible:
        id: "verify_code_submit_cta"
    commands:
      - tapOn:
          id: "verify_code_submit_cta"

- extendedWaitUntil:
    visible:
      id: "verify_code_error"
    timeout: 10000

- takeScreenshot: jm021_ac2_wrong_code_error

# ── AC3: Resend CTA re-requests code — screen stays ──────────────────────────
# jeeb.seam.recovery_countdown_expired is a no-op today (verify_code_resend_cta
# is always tappable — no app-driven countdown on the recovery screen).
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"
      jeeb.seam.recovery_countdown_expired: "true"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 90000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- tapOn:
    id: "recover_email_field"
- inputText: "test@jeeb.app"

- tapOn:
    id: "recover_submit_cta"

- extendedWaitUntil:
    visible:
      id: "verify_code_input"
    timeout: 15000

- tapOn:
    id: "verify_code_resend_cta"

# Screen must stay on verify — input still visible.
- assertVisible:
    id: "verify_code_input"

- takeScreenshot: jm021_ac3_resend_recovery_code
