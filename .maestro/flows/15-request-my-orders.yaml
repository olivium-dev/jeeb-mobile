# Jeeb mobile — 15 Request / My Orders [User] — In Progress bucket.
# Figma node 56535:1525 (client "My Orders", In Progress content).
#
# WHAT THIS PROVES
#   The authenticated client shell renders the My Orders "In Progress" list,
#   and its key elements are present in the LIVE hierarchy, targeted BY SEMANTIC
#   ID (never localized text — AP-5; never coordinates — AP-1):
#     orders_search_bar                — absent (search was removed)
#     orders_create_request_button     — filled "+" create-request CTA
#     orders_active_card_<id>          — the trackable In Progress card
#     orders_track_order_button_<id>   — its "Track my order" CTA
#     orders_filter_open               — the requests filter disc: ABSENT here
#
# NO FILTER CHROME IN THIS BUCKET
#   The three-segment chip row is gone; its replacement is one filter disc over
#   a merged requests list. In Progress is not one of that list's buckets — the
#   sheet offers All / Awaiting offers / Has replies only — so the whole filter
#   chrome (disc, replies badge, applied pills) is deliberately unmounted while
#   this bucket is showing. Asserting the disc ABSENT is the contract here, and
#   there is no in-app affordance to switch buckets from this state at all.
#
# PRIMARY INTERACTION
#   With the chip row gone, the card's own action is the screen's interaction:
#   we tap "Track my order" by id and prove we left the orders list. Fully
#   satisfied by the seeded dev fixtures, so this is a real pass (not an
#   optimistic assertion — AP-9).
#
# BACKEND
#   Dev seam only: jeeb.route=/ + jeeb.home_tab=in_progress lands on the shell
#   home tab seeded with DevClientHomeFixtures (Figma mock data). No live
#   gateway (comparison.md). Certifies visual + behavioural UI parity, NOT E2E
#   integration (UI-GUARDRAILS §6).
#
# SEAM (runtime, no rebuild — dev-seam-runtime.md)
#   launchApp.arguments pass the seam knobs as Android intent extras; the
#   release-inert MethodChannel seam reads them in debug only. clearState is
#   omitted so the freshly-passed extras drive the launch.
#
# MAESTRO 2.x: no inline assertVisible timeout (1.x) — timed waits via
#   extendedWaitUntil; waitForAnimationToEnd before screenshots (AP-7); never a
#   fixed sleep (AP-1).
#
# Run:
#   maestro --device emulator-5558 test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/15-request-my-orders.yaml
appId: ${APP_ID}
---
- launchApp:
    arguments:
      jeeb.route: "/"
      jeeb.home_tab: "in_progress"

# Top create entry — waited+asserted by id (cold launch through the authed shell
# + seeded load). The debug seam pins In Progress content, which is not one of
# the merged list's buckets and therefore carries no filter chrome.
- extendedWaitUntil:
    visible:
      id: "orders_create_request_button"
    timeout: 25000

# Settle the entrance before the evidence frame.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 15_request_my_orders_in_progress

# The filter disc is unmounted while In Progress is showing (see header).
- assertNotVisible:
    id: "orders_filter_open"
# Search is intentionally absent; the header plus remains the create entry.
- assertNotVisible:
    id: "orders_search_bar"
- assertVisible:
    id: "orders_create_request_button"

# ── PRIMARY INTERACTION — Track my order ─────────────────────────────────────
# The seeded In Progress fixture (ip-1, enRoute) renders the card + its Track
# CTA. Tap the CTA by id (not coordinate/label) and prove a real navigation
# effect: we left the orders list, so its create entry is gone.
- assertVisible:
    id: "orders_active_card_ip-1"
- tapOn:
    id: "orders_track_order_button_ip-1"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: "orders_create_request_button"
