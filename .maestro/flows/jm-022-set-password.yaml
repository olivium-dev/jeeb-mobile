# ─────────────────────────────────────────────────────────────────────────────
# JM-022 — Set Password (dual exit: recovery + in-app-social)
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given setpw_new_field + setpw_confirm_field match and are valid, When
#        setpw_submit_cta tapped with mode=recovery, Then route to /login
#        (login_email_field visible) [D90].
#   AC2: Given mode=in-app-social, When setpw_submit_cta tapped successfully,
#        Then route to customer-profile (customer_profile_wallet_chip visible)
#        [D90, JM-035].
#   AC3: Mismatch or weak password: setpw_validation_error visible; form not
#        submitted; screen stays (setpw_submit_cta still present).
#   AC4: Both eye toggles work: setpw_new_visibility_toggle and
#        setpw_confirm_visibility_toggle. Fields remain visible after toggle.
#
# NOTE: setpw_new_visibility_toggle and setpw_confirm_visibility_toggle are
# coined following the convention <screen>_<element>. Engineers must implement
# Semantics(identifier:) on both eye-toggle buttons. setpw_validation_error is
# coined for the validation-error widget.
#
# Mock dependencies: set-password route (B3), POST /auth-service/auth/refresh.
#   RED until B3 lands.
# Governing decisions: D65, D90, D23.
#
# STATUS: RED until JM-022 ships (test-first)
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-022-set-password.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── AC1: mode=recovery → set password → /login ───────────────────────────────
# Navigate the full recovery path: login → forgot → recover → verify → set-password.
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"
      jeeb.seam.recovery_code: "654321"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- tapOn:
    id: "recover_email_field"
- inputText: "test@jeeb.app"

- tapOn:
    id: "recover_submit_cta"

- extendedWaitUntil:
    visible:
      id: "verify_code_input"
    timeout: 15000

# Enter the 6-digit recovery code one digit per cell (RC-7 fix: Maestro inputText
# does not distribute across multi-cell OmdsOtpInput). Cell ids:
# verify_code_input_0 .. verify_code_input_5 (added by app engineer RC-7 fix).
# OmdsOtpInput auto-submits on the last digit (onCompleted fires submit()).
- tapOn:
    id: "verify_code_input_0"
- inputText: "6"
- tapOn:
    id: "verify_code_input_1"
- inputText: "5"
- tapOn:
    id: "verify_code_input_2"
- inputText: "4"
- tapOn:
    id: "verify_code_input_3"
- inputText: "3"
- tapOn:
    id: "verify_code_input_4"
- inputText: "2"
- tapOn:
    id: "verify_code_input_5"
- inputText: "1"

- runFlow:
    when:
      visible:
        id: "verify_code_submit_cta"
    commands:
      - tapOn:
          id: "verify_code_submit_cta"

- extendedWaitUntil:
    visible:
      id: "setpw_new_field"
    timeout: 15000

- takeScreenshot: jm022_ac0_set_password_recovery_mode

- tapOn:
    id: "setpw_new_field"
- inputText: "NewPassword123!"

- tapOn:
    id: "setpw_confirm_field"
- inputText: "NewPassword123!"

- tapOn:
    id: "setpw_submit_cta"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 15000

- takeScreenshot: jm022_ac1_login_after_recovery_set_password

# ── AC2: mode=in-app-social → set password → customer-profile ────────────────
# The in-app-social path is entered when a social-only user sets a password from
# password-security settings. Deep-link directly to the set-password screen with
# mode=in-app-social using jeeb.route; customer_logged_in provides a valid session
# so the authenticated route is reachable. jeeb.seam.set_password_mode documents
# the intent; the route's ?mode= is the source of truth (62_SEAM_HARNESS §4.6).
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"
      jeeb.route: "/set-password?mode=in-app-social"
      jeeb.seam.set_password_mode: "in-app-social"

- extendedWaitUntil:
    visible:
      id: "setpw_new_field"
    timeout: 30000

- takeScreenshot: jm022_ac2a_set_password_social_mode

# Alphanumeric password (no special char) so the obscured-field entry is clean
# across both boxes — a trailing `!` requires a keyboard mode-switch that
# intermittently bled an extra char into the confirm field (length mismatch →
# validation error). The strength floor is letters+digits ≥8, which this clears.
- tapOn:
    id: "setpw_new_field"
- inputText: "SocialPass456"

- tapOn:
    id: "setpw_confirm_field"
- inputText: "SocialPass456"

- tapOn:
    id: "setpw_submit_cta"

# D90 in-app-social exit → customer-profile. Assert a stable id on the profile
# BODY (the screen the goNamed('customer-profile') route renders). The
# `customer_profile_wallet_chip`/`_bell` are overlaid by the SHELL header, which
# this direct route does not mount, so they are not present on this exit; the
# profile body (avatar/name/rows) is the authoritative landing signal.
- extendedWaitUntil:
    visible:
      id: "customer_profile_name"
    timeout: 15000

- assertVisible:
    id: "customer_profile_password_row"

- takeScreenshot: jm022_ac2b_profile_after_social_set_password

# ── AC3: Password mismatch → validation error, form stays ────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"
      jeeb.route: "/set-password?mode=in-app-social"
      jeeb.seam.set_password_mode: "in-app-social"

- extendedWaitUntil:
    visible:
      id: "setpw_new_field"
    timeout: 30000

- tapOn:
    id: "setpw_new_field"
- inputText: "Password123!"

- tapOn:
    id: "setpw_confirm_field"
- inputText: "DifferentPass!"

- tapOn:
    id: "setpw_submit_cta"

- extendedWaitUntil:
    visible:
      id: "setpw_validation_error"
    timeout: 8000

# Submit CTA must still be present (form not submitted).
- assertVisible:
    id: "setpw_submit_cta"

- takeScreenshot: jm022_ac3_validation_error_mismatch

# ── AC4a: New password eye toggle ────────────────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"
      jeeb.route: "/set-password?mode=in-app-social"
      jeeb.seam.set_password_mode: "in-app-social"

- extendedWaitUntil:
    visible:
      id: "setpw_new_field"
    timeout: 30000

- tapOn:
    id: "setpw_new_field"
- inputText: "TestPass123!"

- tapOn:
    id: "setpw_new_visibility_toggle"

- assertVisible:
    id: "setpw_new_field"

- takeScreenshot: jm022_ac4a_new_field_toggle

# ── AC4b: Confirm password eye toggle ────────────────────────────────────────
- tapOn:
    id: "setpw_confirm_field"
- inputText: "TestPass123!"

- tapOn:
    id: "setpw_confirm_visibility_toggle"

- assertVisible:
    id: "setpw_confirm_field"

- takeScreenshot: jm022_ac4b_confirm_field_toggle
