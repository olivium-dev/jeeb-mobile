# Jeeb mobile — 15 Request / My Orders [User] — In Progress bucket.
# Figma node 56535:1525 (client "My Orders", In Progress content).
#
# WHAT THIS PROVES
#   The authenticated client shell renders the My Orders "In Progress" list and
#   its interactive chrome is present in the LIVE hierarchy, targeted BY SEMANTIC
#   ID (never localized text — AP-5; never coordinates — AP-1). Verified present
#   in source on feat/request-filter-ux-20260822:
#     orders_search_bar              — absent (search was removed)
#     orders_create_request_button   — filled "+" create-request CTA
#                                       client_home_greeting.dart:136
#     orders_filter_open             — the requests filter disc: ABSENT here
#
#   NO FILTER CHROME IN THIS BUCKET: the three-segment chip row is gone, and its
#   replacement — one filter disc over a merged requests list — belongs to the
#   All / Awaiting offers / Has replies buckets only. In Progress is not one of
#   them, so client_home_screen.dart (_ReadyLayout._showFilterChrome) unmounts
#   the disc, the replies badge and the applied pills for the whole of this
#   state. Asserting the disc ABSENT is the contract here; there is no in-app
#   affordance to switch buckets from this state, so the flow no longer carries
#   a filter-switching sub-check (it would target chrome that cannot exist).
#
#   SEMANTICS (recon KNOWN DEBT #1 — NOW CLOSED on this branch): the In Progress
#   order card and its "Track my order" CTA now carry Semantics(identifier:)
#   (active_request_card.dart): orders_active_card_<id> on the card,
#   orders_track_order_button_<id> on the CTA. Both are therefore id-targetable
#   from Maestro — this flow asserts them by id and taps the Track CTA by id (no
#   coordinate/label tap — AP-1/AP-5).
#
# PRIMARY INTERACTION
#   The card's primary action ("Track my order") is id-addressable. We assert the
#   seeded trackable card + its Track CTA by id, tap the Track CTA by id, prove
#   we left the list, then return and prove the list came back. All assertions
#   are satisfied by the seeded dev fixtures (DevClientHomeFixtures), so this is
#   a real pass — not an optimistic assertion (AP-9: no optional:true on the
#   primary assertion).
#
# BACKEND / SEAM (runtime, no rebuild — dev-seam-runtime.md)
#   Dev seam only: launchApp.arguments pass jeeb.route=/ + jeeb.home_tab=in_progress
#   as Android intent extras; the release-inert MethodChannel seam reads them in
#   debug only (home_tab.dart:81 maps 'in_progress' -> ClientHomeTab.inProgress
#   and seeds DevClientHomeFixtures). No live gateway. Certifies visual +
#   behavioural UI parity, NOT E2E integration (UI-GUARDRAILS §6). clearState is
#   omitted so the freshly-passed extras drive the launch.
#
# MAESTRO 2.x (2.0.5): no inline assertVisible timeout (1.x syntax) — timed waits
#   via extendedWaitUntil; waitForAnimationToEnd before screenshots (AP-7); never
#   a fixed sleep (AP-1); id-based assertions only (AP-5).
#
# Run:
#   maestro --device emulator-5558 test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/15-request-my-orders-screen-user.yaml
appId: ${APP_ID}
---
- launchApp:
    arguments:
      jeeb.route: "/"
      jeeb.home_tab: "in_progress"

# Top create entry — waited+asserted by id (cold launch through the authed shell
# + seeded fixtures load). The debug seam pins In Progress content, a state the
# merged requests list does not filter — so no filter chrome is mounted.
- extendedWaitUntil:
    visible:
      id: "orders_create_request_button"
    timeout: 25000

# Settle the entrance before the evidence frame (AP-7).
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 15_request_my_orders_screen_user

# The filter disc is unmounted while In Progress is showing (see header).
- assertNotVisible:
    id: "orders_filter_open"
# Search is intentionally absent; the header plus remains the create entry.
- assertNotVisible:
    id: "orders_search_bar"
- assertVisible:
    id: "orders_create_request_button"

# ── PRIMARY INTERACTION — card-level: Track my order (id-addressable) ─────────
# The seeded In Progress fixture card (ip-1, enRoute) renders the card +
# trackable Track CTA. Assert both by id (recon KNOWN DEBT #1 now closed), then
# tap the Track CTA by id — the card's primary action.
- assertVisible:
    id: "orders_active_card_ip-1"
- assertVisible:
    id: "orders_track_order_button_ip-1"
- tapOn:
    id: "orders_track_order_button_ip-1"
- waitForAnimationToEnd:
    timeout: 5000
# Tap routes to the chat/track destination; assert we left the orders list
# (the Requests header is no longer on screen) — a real navigation effect, not
# an optimistic no-op assertion (AP-9).
- assertNotVisible:
    id: "orders_create_request_button"
# Return to the orders list.
- back

# ── RETURN CHECK — the bucket survives the round trip ────────────────────────
# Back lands on the same In Progress state: the seeded card is rendered again
# and the filter chrome is still unmounted (this bucket owns none — see header).
- extendedWaitUntil:
    visible:
      id: "orders_active_card_ip-1"
    timeout: 10000
- assertVisible:
    id: "orders_create_request_button"
- assertNotVisible:
    id: "orders_filter_open"
