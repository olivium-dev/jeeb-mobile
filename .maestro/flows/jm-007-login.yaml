# ─────────────────────────────────────────────────────────────────────────────
# JM-007 — Login (email/password)
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given the login screen, When valid creds entered in login_email_field +
#        login_password_field and login_continue_cta tapped, Then route to
#        Requests tab (shell_tab_requests visible).
#   AC2: Given login_password_visibility_toggle, When tapped, Then password
#        masking flips (login_password_field is asserted visible still — the
#        visual flip is a UI contract the engineer must implement; Maestro
#        asserts the element remains present and the toggle is tappable).
#   AC3: When login_forgot_password_link tapped → /recover
#        (recover_email_field visible) [JM-020].
#   AC4: When login_signup_link tapped → sign-up
#        (signup_name_field visible) [JM-008].
#   AC5: When login_social_google / login_social_facebook / login_social_apple
#        tapped → social flow (social_login_facebook_cta visible as proof the
#        social screen loaded) [JM-018].
#   AC6: Given biometric-enrolled returning user, Then login_biometric_affordance
#        is visible [D23].
#
# Mock dependencies: POST /auth-service/auth/login (B3), POST /auth-service/auth/refresh,
#   POST /push-notification/v1/devices/register. Flows are RED until mock B1+B3 land.
#
# STATUS: RED until JM-007 ships (test-first)
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-007-login.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── AC1: Successful email+password login → Requests tab ──────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- takeScreenshot: jm007_ac1a_login_screen

- tapOn:
    id: "login_email_field"
- inputText: "test@jeeb.app"

- tapOn:
    id: "login_password_field"
- inputText: "Password123!"

- tapOn:
    id: "login_continue_cta"

- extendedWaitUntil:
    visible:
      id: "shell_tab_requests"
    timeout: 15000

- takeScreenshot: jm007_ac1b_requests_tab_after_login

# ── AC2: Password visibility toggle ──────────────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_password_field"
- inputText: "Password123!"

# Toggle masking on
- tapOn:
    id: "login_password_visibility_toggle"

# Field must still be present after toggle
- assertVisible:
    id: "login_password_field"

- takeScreenshot: jm007_ac2_password_toggle

# ── AC3: Forgot password link → /recover ─────────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- takeScreenshot: jm007_ac3_recover_password_screen

# ── AC4: Sign-up link → sign-up screen ───────────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_signup_link"

- extendedWaitUntil:
    visible:
      id: "signup_name_field"
    timeout: 15000

- takeScreenshot: jm007_ac4_signup_screen_from_login

# ── AC5: Social CTA → social login screen ────────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

# Assert social CTAs are present on the login screen
- assertVisible:
    id: "login_social_google"
- assertVisible:
    id: "login_social_facebook"
- assertVisible:
    id: "login_social_apple"

- takeScreenshot: jm007_ac5_social_ctas_visible

# ── AC6: Biometric affordance visible for enrolled returning user ─────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "biometric_enrolled_logged_out"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- assertVisible:
    id: "login_biometric_affordance"

- takeScreenshot: jm007_ac6_biometric_affordance_on_login
