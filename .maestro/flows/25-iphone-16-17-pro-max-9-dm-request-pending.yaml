# Jeeb mobile — 25 iPhone 16 & 17 Pro Max - 9 (DM request — Pending).
# Figma node 56560:1403 (jeeber feed, "Pending Response" chip, one offered card).
#
# WHAT THIS PROVES
#   The deliveryman feed renders the pending-response card (avatar + name +
#   rating + tier + items + distance + italic "Pending" status + 09:41
#   timestamp), targeted BY SEMANTIC ID (verified in source on
#   feat/request-filter-ux-20260822):
#     jeeber_feed_request_card_dev-feed-pending — the pending card
#                                                 jeeber_feed_card.dart (JeeberFeedCard)
#     jeeber_feed_filter_open                   — the filter disc trailing the
#                                                 stage strip
#                                                 jeeber_feed_tab_view.dart (_feedControls)
#     jeeber_feed_filter_sheet                  — the sheet it opens
#     jeeber_feed_search_field                  — the search input, now a facet
#                                                 INSIDE that sheet
#                                                 jeeber_feed_filter_sheet.dart (_FeedSearchField)
#     jeeber_feed_filter_apply                  — the sheet's commit CTA
#   The italic "Pending" status (jeeber_feed_card.dart _PendingStatus, key
#   jeeber-feed-pending-status) is the variant axis vs screen 24/26.
#
# PRIMARY INTERACTION
#   The pending card has no per-card CTA in this Figma state (the jeeber is
#   waiting on the client). The assertible interaction is still the search
#   field — but it now lives behind the filter disc instead of on the feed, so
#   the flow opens the sheet, focuses the field there, and commits an unchanged
#   selection. Nothing is staged, so the feed is left as it was and the card
#   must still be present afterwards — an honest liveness check matched to what
#   this state actually exposes (pilot-learning #7). On the Pending stage the
#   sheet carries the search facet only; the tier chips belong to Nearby.
#
# BACKEND / SEAM
#   Dev seam: jeeb.route=/ + jeeb.feed=pending → seam forces the jeeber role,
#   DashboardTab seeds DevJeeberFeedFixtures.pending() with the Pending Response
#   chip selected (dashboard_tab.dart _DevFeedScaffold). No live gateway. UI
#   parity only (UI-GUARDRAILS §6). Seam knobs via launchApp.arguments
#   (Android intent extras, release-inert).
#
# MAESTRO 2.x: extendedWaitUntil for timed waits; waitForAnimationToEnd before
#   screenshots; no fixed sleeps; no coordinate taps; id-based assertions only.
#
# Run:
#   maestro --device NONE-DEVICE-FREE test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/25-iphone-16-17-pro-max-9-dm-request-pending.yaml
appId: ${APP_ID}
---
- launchApp:
    arguments:
      jeeb.route: "/"
      jeeb.feed: "pending"

# Pending-response card — waited+asserted by id (cold launch + seeded load).
- extendedWaitUntil:
    visible:
      id: "jeeber_feed_request_card_dev-feed-pending"
    timeout: 25000
# The magnifier disc is gone; the feed's only trailing control is the filter
# disc, and it is always mounted (no progressive disclosure on this board).
- assertVisible:
    id: "jeeber_feed_filter_open"

# Evidence frame is the FEED itself — the search bar no longer sits on it.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 25_iphone_16_17_pro_max_9_dm_request_pending

# PRIMARY INTERACTION: open the filter sheet and focus the search field there.
- tapOn:
    id: "jeeber_feed_filter_open"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "jeeber_feed_filter_sheet"
- assertVisible:
    id: "jeeber_feed_search_field"
- tapOn:
    id: "jeeber_feed_search_field"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 25_iphone_16_17_pro_max_9_dm_request_pending_filter_sheet

# Commit an unchanged selection: the sheet closes and the card is still there.
- assertVisible:
    id: "jeeber_feed_search_field"
- tapOn:
    id: "jeeber_feed_filter_apply"
- extendedWaitUntil:
    notVisible:
      id: "jeeber_feed_filter_sheet"
    timeout: 10000
- assertVisible:
    id: "jeeber_feed_request_card_dev-feed-pending"
