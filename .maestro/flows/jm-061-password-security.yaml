# ─────────────────────────────────────────────────────────────────────────────
# JM-061 — Password & Security
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given a standard (email/password) account, Then password_security_root
#        visible + password_current_field + password_new_field +
#        password_confirm_field present.
#   AC2: password_new_visibility_toggle + password_confirm_visibility_toggle
#        flip masking on respective fields.
#   AC3: password_submit_cta: mismatched new/confirm shows
#        password_mismatch_error; strength too weak shows
#        password_strength_error.
#   AC4: Social-only account: password_set_entry visible (no current-field);
#        password_set_entry → auth-set-password?mode=in-app-social
#        (setpw_new_field visible) [D90, JM-022].
#   AC5: password_back → customer-profile
#        (customer_profile_wallet_chip visible) [JM-035].
#
# Mock: — (no network call needed for validation ACs; password change
#           would call PATCH /user-management/users/:userId but test focuses on UI)
# Seam:
#   AC1/2/3/5: jeeb.seam.session=customer_logged_in
#              + jeeb.route=/settings/password
#   AC4: jeeb.seam.session=customer_logged_in
#        + jeeb.seam.account_type=social_only  ← NEW W4 seed (see below)
#        + jeeb.route=/settings/password
#
# NEW SEAM KEYS / MOCK SEEDS REQUIRED (W4 test-data contract):
#   jeeb.seam.account_type=social_only — seeds user-client-001 as having
#     no password on file (social-only), so password_security_screen renders
#     the set-entry variant rather than current/new/confirm fields.
#   POST /__mock/seed/account { "type": "social_only", "userId": "user-client-001" }
#   (Alternatively: a dedicated jeeb.seam.has_password="false" flag.)
#
# COINED IDENTIFIERS:
#   password_security_root        — root of the screen
#   password_current_field        — current password field (standard accounts)
#   password_new_field            — new password input
#   password_confirm_field        — confirm new password input
#   password_new_visibility_toggle   — eye icon for password_new_field
#   password_confirm_visibility_toggle — eye icon for password_confirm_field
#   password_submit_cta           — save/submit button
#   password_mismatch_error       — inline error when new != confirm
#   password_strength_error       — inline error when new password too weak
#   password_set_entry            — "Set a password" entry for social-only accounts (D90)
#
# STATUS: RED until JM-061 ships + account_type=social_only seed exists (AC4).
#         Decisions: D90.
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-061-password-security.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── AC1: Standard account — all three fields present ─────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"
      jeeb.route: "/settings/password"

- extendedWaitUntil:
    visible:
      id: "password_security_root"
    timeout: 30000

- assertVisible:
    id: "password_current_field"

- assertVisible:
    id: "password_new_field"

- assertVisible:
    id: "password_confirm_field"

- takeScreenshot: jm061_ac1_standard_account_fields

# ── AC2: Visibility toggles flip masking ─────────────────────────────────────
- tapOn:
    id: "password_new_visibility_toggle"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "password_new_field"

- tapOn:
    id: "password_confirm_visibility_toggle"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "password_confirm_field"

- takeScreenshot: jm061_ac2_visibility_toggles

# ── AC3: Mismatched passwords → mismatch error ────────────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"
      jeeb.route: "/settings/password"

- extendedWaitUntil:
    visible:
      id: "password_security_root"
    timeout: 30000

- tapOn:
    id: "password_current_field"

- inputText: "OldPass1!"

- tapOn:
    id: "password_new_field"

- inputText: "NewPass1!"

- tapOn:
    id: "password_confirm_field"

- inputText: "DifferentPass2!"

- tapOn:
    id: "password_submit_cta"

- extendedWaitUntil:
    visible:
      id: "password_mismatch_error"
    timeout: 10000

- takeScreenshot: jm061_ac3_mismatch_error

# ── AC4: Social-only account → set-entry → auth-set-password ─────────────────
# REQUIRES: account_type=social_only seed
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"
      jeeb.seam.account_type: "social_only"
      jeeb.route: "/settings/password"

- extendedWaitUntil:
    visible:
      id: "password_security_root"
    timeout: 30000

- assertVisible:
    id: "password_set_entry"

- tapOn:
    id: "password_set_entry"

- extendedWaitUntil:
    visible:
      id: "setpw_new_field"
    timeout: 15000

- takeScreenshot: jm061_ac4_social_set_entry_to_set_password

# ── AC5: Back → customer-profile ─────────────────────────────────────────────
# Enter via the Profile-tab row (pushNamed) so `password_back` pops back to the
# shell Profile tab, where `customer_profile_wallet_chip` (the shell header
# overlay) is shown. The chip is painted only by the shell, so a bare route pin
# (no shell beneath) could never surface it on back.
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "customer_logged_in"

- extendedWaitUntil:
    visible:
      id: "shell_tab_requests"
    timeout: 30000

- tapOn:
    id: "shell_tab_profile"

- extendedWaitUntil:
    visible:
      id: "customer_profile_wallet_chip"
    timeout: 15000

- tapOn:
    id: "customer_profile_password_row"

- extendedWaitUntil:
    visible:
      id: "password_security_root"
    timeout: 15000

- tapOn:
    id: "password_back"

- extendedWaitUntil:
    visible:
      id: "customer_profile_wallet_chip"
    timeout: 15000

- takeScreenshot: jm061_ac5_back_to_customer_profile
