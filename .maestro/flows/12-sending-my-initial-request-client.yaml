# Maestro flow — Sending my initial request [Client] (screen 12)
#
# THE FRAME — Figma node 56535:6469 (file ZOi3kKtw7sd42ssSVX3Kn4): the pre-offers
#   `sending` state — the instant the client has just sent their first delivery
#   request and NO offer has arrived yet. The chat shows a centered "ORD-…"
#   navbar, a "Today" day chip, a SINGLE navy outgoing bubble ("I need 3 kilos of
#   potatoes…") with a 09:41 timestamp + teal read double-tick, an EMPTY scroll
#   area below it (NO offer cards, NO "Accept only one offer" footer), and the
#   message composer (+, hint, mic, navy send pill) at the bottom.
#   This is the SUBJECT of THIS flow. The offers-landing state (Figma 56535:6659,
#   the same request PLUS stacked offer cards + the offer-only-one footer) is a
#   DIFFERENT, LATER frame — the `broadcasting` selector that flow 02-chat-client
#   exercises. This flow proves we are in the pre-offers `sending` state, not in
#   that later offers state (see NEGATIVE ASSERTION below).
#   NO NEW SCREEN — this is a parity-validate of the existing client ChatScreen
#   driven into its `sending` state. Built screen: ChatScreen via
#   DevChatPreviewScreen (lib/features/chat/presentation/...).
#
# NAV — RUNTIME DEV SEAM (dev-seam-runtime.md): reached via the runtime dev seam
#   `jeeb.state: sending` knob, NOT a dart-define rebuild. `launchApp.arguments`
#   are delivered to Android as String intent extras, which MainActivity.kt
#   `readSeamExtras()` reads (seam source priority 1). `jeeb.state` TAKES
#   PRECEDENCE over `jeeb.route`: the router redirects straight to /dev-chat →
#   DevChatPreviewScreen(selector: 'sending') → ChatScreen in its pre-offers
#   `sending` thread, skipping onboarding + biometric gates and the live OTP
#   roundtrip.
#     Equivalent adb one-liner (documented; the flow does it via launchApp):
#       adb -s emulator-5560 shell am start -S \
#         -n app.jeeb.mobile.dev/app.jeeb.mobile.MainActivity \
#         -e jeeb.state sending -e jeeb.locale en
#     RTL variant: append `-e jeeb.locale ar` (renders mirrored, bubble on the
#       opposite side, Arabic body string).
#   Sticky alternative (seam source priority 2), if a launcher forwards no
#   extras: push the device file before launchApp —
#       printf '{"jeeb.state":"sending","jeeb.locale":"en"}' \
#         > /tmp/jeeb-dev-seam.json
#       adb -s emulator-5560 push /tmp/jeeb-dev-seam.json \
#         /data/local/tmp/jeeb-dev-seam.json
#
# BACKEND: DevChatFixtureGateway(sending: true) — in-memory deterministic fixture
#   seeding EXACTLY ONE outgoing request bubble (today 09:41, read) and ZERO offer
#   cards, the pre-offers state Figma 56535:6469 draws. (The fixture's `phase`
#   field stays broadcasting so the composer remains visible, but `sending: true`
#   short-circuits the history to the single outgoing bubble with no offers — see
#   dev_chat_fixture_gateway.dart `_sendingThread()`.) NO live gateway. A PASS
#   here certifies VISUAL + BEHAVIORAL UI PARITY ONLY, not end-to-end chat-service
#   integration (UI-GUARDRAILS §6). Production path is DioChatGateway →
#   chat-service via jeeb-gateway, unchanged by this work.
#
# FRAME FIDELITY (comparison.md): the `sending` fixture renders the frame exactly
#   — one outgoing bubble, no offer cards, no "Accept only one offer" footer. The
#   footer is gated on offer-card rows being present (chat_screen.dart only emits
#   ChatOfferOnlyOneFooter for an `offerNote` row, which the `sending` thread
#   never produces), so it is structurally absent here. We anchor the POSITIVE
#   assertions on the outgoing bubble + composer (the frame's subject) and add a
#   NEGATIVE assertion on the offer-footer id to prove we are pre-offers.
#
# SYNTAX: Maestro 2.0.5 — extendedWaitUntil for timeouts (inline assertVisible
#   `timeout:` is 1.x syntax and is REJECTED by 2.0.5, pilot learning #3);
#   waitForAnimationToEnd before every takeScreenshot (pilot learning #4);
#   tapOn/assertVisible/assertNotVisible by Semantics identifier only — no
#   coordinate taps, no sleeps, no localized-text matching (the navbar order id +
#   bubble body + hint are localized/fixture strings; the AR run would break a
#   text matcher — ids are locale-invariant).
#
# IDS asserted — verified present in lane2 source (grep of lib/features/chat):
#   chat_detail_message_list         (chat_screen.dart:318 — the scrollable thread)
#   chat_detail_message_read         (chat_message_bubble.dart:511 — the teal read
#                                    double-tick on the sent outgoing bubble; proves
#                                    it's an OUTGOING message in the read state, the
#                                    exact "sent into broadcast" signal the frame
#                                    shows)
#   chat_detail_message_input        (chat_composer.dart:210 — the composer field)
#   chat_detail_offer_only_one_note  (chat_offer_only_one_footer.dart:18 — the
#                                    "Accept only one offer" footer; asserted
#                                    NOT-visible here, see NEGATIVE ASSERTION)
#
# NEGATIVE ASSERTION — PROVE PRE-OFFERS (the screen-12 vs screen-13 boundary):
#   We assert `chat_detail_offer_only_one_note` is NOT visible. That footer
#   renders ONLY when offer-card rows are in the thread (chat_screen.dart:382
#   emits ChatOfferOnlyOneFooter for the `offerNote` row; offer_card_bubble.dart
#   carries `chat_detail_message_${id}` + `chat_detail_accept_${offerId}` for the
#   cards themselves). The `sending` fixture seeds ZERO offer cards, so the footer
#   id is structurally absent — its non-presence is the on-device proof that we
#   are in the pre-offers `sending` state and NOT in the later offers-landing
#   `broadcasting` state (Figma 56535:6659). This exact dual contract is pinned
#   at the widget level by test/features/chat/dev_chat_sending_fixture_test.dart:
#   the `sending` selector → `chat_detail_offer_only_one_note` findsNothing (line
#   138), the `broadcasting` selector → the same id findsOneWidget (line 154). The
#   footer id is a locale-invariant Semantics identifier (not a localized text
#   matcher), so it is AP-5-safe for the AR run. We deliberately use the footer id
#   rather than the offer-card ids because the footer is a single, deterministic
#   id (no fixture-generated `${offerId}` suffix to glob).
#
# SELECTOR NOTES (semantics topology — verified in source, NOT a defect here):
#   (a) The navbar order title ("ORD-23748") is a fixture string rendered without
#       its own identifier, and OMDSAppBar's back button carries no Semantics id;
#       there is no locale-invariant navbar id to assert, so we anchor parity on
#       the message-list + read-tick (which mount only inside the chat-detail
#       scaffold) rather than a localized/fixture text matcher (AP-5 i18n
#       anti-pattern). The header is thus proven TRANSITIVELY: the message list +
#       read tick only mount inside the chat-detail scaffold whose AppBar is the
#       navbar (a blank/launcher fallthrough would have neither).
#   (b) Individual bubbles carry `chat_detail_message_${id}` ids whose `${id}` is
#       a fixture-generated value we do not hardcode; we assert the stable
#       `chat_detail_message_read` tick (the read-state signal) + the list
#       container, which are deterministic regardless of the generated id.
#   (c) The send pill / mic / attach inside the composer are
#       chat_composer_icon_button instances; the composer's primary surface is
#       the input field (`chat_detail_message_input`), which we assert as the
#       composer-present anchor.
#
# PRIMARY-INTERACTION POSTURE (pilot #7 / AP-9 — no fabricated assertion):
#   The frame's subject is the already-sent outgoing request + the live composer,
#   not a new send. Sending a second message over the dev fixture would not
#   make an offer arrive — the fixture is deterministic and the offer-arrival
#   transition needs the real chat-service. So we prove the composer is LIVE by
#   tapping the input field (focus accepted, no crash, field + list still
#   mounted), and we do NOT fabricate a "message sent → offers arrived" assertion
#   the dev backend cannot satisfy. The real send→broadcast→offer-arrival path is
#   a later end-to-end integration gate.

appId: ${APP_ID}
---
# ── LAUNCH via runtime dev seam (jeeb.state → DevSeam priority-1, wins over route)
- launchApp:
    stopApp: true
    arguments:
      jeeb.state: "sending"
      jeeb.locale: "en"

# ── STATE RENDERS: the chat thread (the sent outgoing request) is on screen ────
# The message list being visible proves the pre-offers `sending` chat rendered
# (not a blank first-frame / launcher fallthrough). 40s timeout absorbs slow
# Impeller-on-software-GL first frames on this 2GB AVD (pilot memory; AP-3-legit,
# not a sleep).
- extendedWaitUntil:
    visible:
      id: "chat_detail_message_list"
    timeout: 40000
- waitForAnimationToEnd

# ── SENT-REQUEST SIGNAL: the outgoing bubble carries the read double-tick ──────
# `chat_detail_message_read` is the teal read tick on the sent outgoing message —
# the exact "my initial request was sent into the broadcast" state the frame
# depicts. Its presence proves an OUTGOING, read message exists.
- assertVisible:
    id: "chat_detail_message_read"

# ── PRE-OFFERS PROOF: NO offers have arrived (screen-12, not screen-13) ─────────
# The "Accept only one offer" footer (`chat_detail_offer_only_one_note`) renders
# ONLY when offer-card rows exist in the thread. The `sending` fixture seeds ZERO
# offer cards, so the footer is structurally absent. Asserting it NOT-visible is
# the on-device proof that this is the pre-offers `sending` frame (Figma
# 56535:6469) and NOT the later offers-landing `broadcasting` frame (56535:6659).
# Locale-invariant Semantics id (AP-5-safe); the same dual contract is pinned at
# the widget level in dev_chat_sending_fixture_test.dart (sending → findsNothing,
# broadcasting → findsOneWidget).
- assertNotVisible:
    id: "chat_detail_offer_only_one_note"

# ── COMPOSER present (the frame's chrome) ──────────────────────────────────────
# No navbar id is asserted here: the broadcasting navbar carries NO avatar
# (`chat_detail_avatar` is accepted-phase-only per Figma 56535:6469) and its
# back chevron is OMDS-rendered without a Semantics id — see the NAVBAR
# ASSERTION REMOVED note above. The composer input is the navbar-adjacent chrome
# anchor; the chat-detail scaffold (hence the navbar) is transitively proven by
# the message list + read tick asserted above.
# extendedWaitUntil (not bare assertVisible): the composer lays out a beat after
# the message list on this 2GB AVD, so a deterministic wait absorbs the
# bottom-bar settle without a sleep (same AP-3-legit pattern as the list above).
- extendedWaitUntil:
    visible:
      id: "chat_detail_message_input"
    timeout: 15000

# ── CAPTURE: the loaded "sending my initial request" pre-offers frame ──────────
- waitForAnimationToEnd
- takeScreenshot: "12-sending-my-initial-request-loaded"

# ── PRIMARY INTERACTION: the composer input is live (focusable) ────────────────
# Tapping the composer field focuses it (keyboard intent) without advancing the
# deterministic `sending` fixture. We prove the composer is a live control by:
# tap accepted → no crash → the input + thread are still present/queryable. We do
# NOT send a second message / assert a phase change the dev backend cannot
# produce (AP-9).
- tapOn:
    id: "chat_detail_message_input"
# Focus accepted (the tap above) proves the composer is a live control. We then
# re-confirm the input is still present/queryable with the keyboard up.
#
# NOTE — we deliberately do NOT call `hideKeyboard` here: on this Android/Flutter
# build Maestro's `hideKeyboard` dispatches a BACK event, which the chat route
# consumes as `Navigator.maybePop()` and POPS DevChatPreviewScreen back to Home
# (verified on-device: post-`hideKeyboard` the chat ids + "ORD-23748" all vanish
# and the tree is the Home screen). So we keep the keyboard up and use
# `extendedWaitUntil` to re-query the input through the IME show animation
# (re-lays-out the bottom bar on this 2GB AVD) — a deterministic settle, no sleep,
# no route change, no weakened assertion. The thread + read-tick + the no-offers
# negative assertion above prove the pre-offers `sending` chat rendered; the live,
# still-mounted composer input is the composer-is-live proof this step exists for
# (AP-9: we do not fabricate a "message sent → offers arrived" assertion the dev
# fixture can't satisfy).
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_detail_message_input"
    timeout: 15000
