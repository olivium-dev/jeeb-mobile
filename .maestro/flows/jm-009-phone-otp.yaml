# ─────────────────────────────────────────────────────────────────────────────
# JM-009 — Phone OTP Verification (re-parent + returning-user bypass)
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given a fresh sign-up, When 6-digit OTP entered in phone_otp_input
#        and phone_otp_verify_cta tapped (or auto-submitted), Then route to
#        Requests tab (shell_tab_requests visible) — account now active.
#   AC2: Given resend countdown, When phone_otp_resend_cta tapped after
#        countdown expires, Then a new code is requested (phone_otp_input
#        stays visible / countdown resets — asserting screen still shown).
#   AC3: Given a returning logged-in user with biometric enrolled, Then this
#        screen is bypassed (biometric_unlock_prompt shown instead) [D23].
#        This AC is covered structurally by jm-005-biometric-unlock; here we
#        assert the OTP screen is NOT reached for the biometric seam.
#   NOTE: OTP length is 6 digits (contract matches mock B4).
#        The mock dev code is 123456 (42 W-1 FLOOR CLOSED); flow types it directly.
#
# W1 FIX ROUND (APP_DEFECT / gRPC drop between sub-flows):
#   - AC2 previously navigated walkthrough → signup → phone entry using text-based
#     taps (AP-5 violation) and then hit gRPC UNAVAILABLE after AC1's session.
#   - Fix: AC2 resets mock state first, then uses the route pin
#     (jeeb.seam.session=logged_out_returning + jeeb.route=/register) so the flow
#     lands directly on the phone-OTP screen without re-running the full signup
#     walkthrough. The otp_countdown_expired seam makes phone_otp_resend_cta
#     immediately tappable. phone_otp_resend_cta is the correct resend selector
#     (not signup_submit_cta).
#   - All text-based taps in the original AC2 subflow (for phone entry) are
#     eliminated — the route pin bypasses that step entirely for AC2's purpose.
#
# Mock dependencies: POST /auth-service/auth/otp/request,
#   POST /auth-service/auth/otp/verify. Flow is RED until mock B1+B4 land.
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-009-phone-otp.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
tags:
  - jm-009
  - w0
  - auth
---

# ── AC1: OTP entry after sign-up → Requests tab ──────────────────────────────
# Reset mock state first so otptest@jeeb.app has no prior registration (RC-5 fix).
# jeeb.seam.otp_code documents intent; the mock already accepts dev code 123456.
# Navigate from walkthrough slide 1 through all slides to reach sign-up.
- evalScript: |
    http.post('http://10.0.2.2:4010/__mock/reset', '{}', {'Content-Type': 'application/json'});

- launchApp:
    clearState: true
    arguments:
      jeeb.seam.otp_code: "123456"

# Generous cold-boot headroom: the first clearState launch + seam bootstrap can
# sit on the navy splash a while on a loaded emulator before the walkthrough paints.
- extendedWaitUntil:
    visible:
      id: "walkthrough_slide_1"
    timeout: 90000

- tapOn:
    id: "onboarding_next_button"

- extendedWaitUntil:
    visible:
      id: "walkthrough_slide_2"
    timeout: 8000

- tapOn:
    id: "onboarding_next_button"

- extendedWaitUntil:
    visible:
      id: "walkthrough_slide_3"
    timeout: 8000

- tapOn:
    id: "walkthrough_get_started_cta"

- extendedWaitUntil:
    visible:
      id: "signup_name_field"
    timeout: 15000

- tapOn:
    id: "signup_name_field"
- inputText: "OTP Test User"

- tapOn:
    id: "signup_email_field"
- inputText: "otptest@jeeb.app"

- tapOn:
    id: "signup_password_field"
- inputText: "Password123!"

- tapOn:
    id: "signup_submit_cta"

# After signup the app shows the _register_hero phone-entry step before OTP (RC-10).
- extendedWaitUntil:
    visible:
      id: "_register_hero"
    timeout: 15000

- takeScreenshot: jm009_ac1a_register_hero_phone_entry

- tapOn:
    text: "Phone number"
- inputText: "0501234567"

- tapOn:
    text: "Send code"

- extendedWaitUntil:
    visible:
      id: "phone_otp_input"
    timeout: 15000

- takeScreenshot: jm009_ac1b_otp_screen

# Enter the 6-digit OTP one digit per cell (RC-7 fix: Maestro inputText does not
# distribute across multi-cell OmdsOtpInput; tap each cell by its per-cell id).
# Cell ids: phone_otp_input_0 .. phone_otp_input_5 (added by app engineer RC-7 fix).
# OmdsOtpInput auto-submits on the last digit (onCompleted fires submit()).
- tapOn:
    id: "phone_otp_input_0"
- inputText: "1"
- tapOn:
    id: "phone_otp_input_1"
- inputText: "2"
- tapOn:
    id: "phone_otp_input_2"
- inputText: "3"
- tapOn:
    id: "phone_otp_input_3"
- inputText: "4"
- tapOn:
    id: "phone_otp_input_4"
- inputText: "5"
- tapOn:
    id: "phone_otp_input_5"
- inputText: "6"

- runFlow:
    when:
      visible:
        id: "phone_otp_verify_cta"
    commands:
      - tapOn:
          id: "phone_otp_verify_cta"

- extendedWaitUntil:
    visible:
      id: "shell_tab_requests"
    timeout: 15000

- takeScreenshot: jm009_ac1c_requests_tab_after_otp

# ── AC2: Resend CTA re-requests a code ───────────────────────────────────────
# RC-10: the bare `jeeb.route=/register` pin for a logged-out user does NOT hold
# the OTP screen — after the resend tap the unauthenticated register route
# bounces to /login. Reach the OTP screen the SAME way the app actually does:
# a clean signup → phone-entry → send-code funnel (self-contained launch). The
# otp_countdown_expired seam zeroes the resend cooldown so phone_otp_resend_cta
# is tappable on the first OTP frame. Correct selector: phone_otp_resend_cta.
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.otp_countdown_expired: "true"
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_signup_link"
    timeout: 90000

- tapOn:
    id: "login_signup_link"

- extendedWaitUntil:
    visible:
      id: "signup_name_field"
    timeout: 15000

- tapOn:
    id: "signup_name_field"
- inputText: "Resend Test User"

- tapOn:
    id: "signup_email_field"
- inputText: "otp-resend@jeeb.app"

- tapOn:
    id: "signup_password_field"
- inputText: "Password123!"

- tapOn:
    id: "signup_submit_cta"

- extendedWaitUntil:
    visible:
      id: "_register_hero"
    timeout: 15000

- tapOn:
    text: "Phone number"
- inputText: "0501234567"

- tapOn:
    text: "Send code"

- extendedWaitUntil:
    visible:
      id: "phone_otp_input"
    timeout: 15000

- takeScreenshot: jm009_ac2a_otp_screen_for_resend

# Resend CTA is immediately tappable because countdown is expired (seam).
# phone_otp_resend_cta is the correct resend selector per the identifier contract.
- extendedWaitUntil:
    visible:
      id: "phone_otp_resend_cta"
    timeout: 10000

- tapOn:
    id: "phone_otp_resend_cta"

- waitForAnimationToEnd:
    timeout: 5000

# After resend, the OTP screen must still be showing (new code was requested).
- assertVisible:
    id: "phone_otp_input"

- takeScreenshot: jm009_ac2b_resend_otp_screen_survives

# ── AC3: Biometric enrolled user bypasses OTP ────────────────────────────────
# With biometric session, the splash router sends to /lock, not /otp.
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "biometric_enrolled"

- extendedWaitUntil:
    visible:
      id: "biometric_unlock_prompt"
    timeout: 60000

# Confirm phone OTP screen is NOT shown — it must not appear at all.
- assertNotVisible:
    id: "phone_otp_input"

- takeScreenshot: jm009_ac3_otp_bypassed_for_biometric
