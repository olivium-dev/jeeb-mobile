# Jeeb mobile — 13 Request / Pending Requests [User].
# Figma node 56535:1783 (client "My Orders", Pending Requests chip selected).
#
# WHAT THIS PROVES
#   The client shell renders the Pending Requests list (lean rows: order id +
#   items + tier, no avatar/progress/CTA), every element targeted BY SEMANTIC ID
#   (all verified present in source on feat/jeeb-ui-parity-lane-b4):
#     orders_filter_pendingRequests  — Pending Requests chip (selected here)
#                                       client_home_screen.dart:355 (orders_filter_$keySuffix)
#     orders_filter_inProgress       — In Progress chip
#     orders_filter_replies          — Replies chip
#     orders_search_bar              — pill search bar (client_home_screen.dart:278)
#     orders_create_request_button   — filled "+" create-request CTA
#                                       client_home_greeting.dart:136
#     pending_requests_item_<id>     — a pending row (pending_request_card.dart:27),
#                                       seeded ids pen-1 / pen-2 / pen-3
#
# PRIMARY INTERACTION
#   The pending row is tappable (opens request detail in the full product). On
#   the dev seam the tap is wired to onOpenRequest -> chat route
#   (home_tab.dart:50,95). We assert the tap is accepted and the screen does not
#   crash, then return — we do NOT assert a downstream destination the dev
#   backend can't guarantee (maestro-anti-patterns AP-9: no optional: true on a
#   primary assertion; we simply don't over-assert an unguaranteed nav target).
#
# BACKEND / SEAM
#   Dev seam: jeeb.route=/ + jeeb.home_tab=pending → shell home tab seeded with
#   DevClientHomeFixtures, Pending filter selected (home_tab.dart:40,77-90;
#   dev_seam_config.dart:35 reads jeeb.home_tab). No live gateway. UI parity
#   only (UI-GUARDRAILS §6). Seam knobs via launchApp.arguments (Android intent
#   extras, release-inert — dev-seam-runtime.md).
#
# MAESTRO 2.x: extendedWaitUntil for timed waits (2.0.5 rejects inline
#   assertVisible:{timeout}); waitForAnimationToEnd before screenshots; no fixed
#   sleeps; no coordinate taps; id-based assertions only.
#
# Run:
#   maestro --device emulator-5558 test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/13-request-pending-requests-screen-user.yaml
appId: ${APP_ID}
---
- launchApp:
    arguments:
      jeeb.route: "/"
      jeeb.home_tab: "pending"

# Pending Requests chip — waited+asserted by id (cold launch + seeded load).
- extendedWaitUntil:
    visible:
      id: "orders_filter_pendingRequests"
    timeout: 25000

- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 13_request_pending_requests_screen_user

# All three filter chips + shared chrome present.
- assertVisible:
    id: "orders_filter_inProgress"
- assertVisible:
    id: "orders_filter_replies"
- assertVisible:
    id: "orders_search_bar"
- assertVisible:
    id: "orders_create_request_button"

# A pending row is present (seeded fixture id pen-1).
- extendedWaitUntil:
    visible:
      id: "pending_requests_item_pen-1"
    timeout: 10000

# ── PRIMARY INTERACTION — open a pending request ─────────────────────────────
# Tap the row by id (not coordinate/label). The dev seam wires onOpenRequest to
# the chat route; we assert the tap is accepted and the app does not crash.
- tapOn:
    id: "pending_requests_item_pen-1"
- waitForAnimationToEnd:
    timeout: 5000

# Sanity: the app is still alive after the tap (no crash). The chip we waited on
# at launch is no longer asserted (we may have navigated); instead confirm the
# process did not die by re-reading any rendered element from the resulting view.
# We do NOT assert a specific chat destination (dev-backend cannot guarantee it).
