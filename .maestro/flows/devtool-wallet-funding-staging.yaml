appId: ${APP_ID}
name: Dev Tool stages and verifies a real Jeeber wallet funding move
tags:
  - critical
  - staging
  - devtool
  - wallet
---
- extendedWaitUntil:
    visible:
      text: "Jeeber Dev Tool"
    timeout: 30000
- tapOn:
    id: "devtool.walletFunding.home"
- extendedWaitUntil:
    visible:
      text: "Choose an existing Jeeber.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "devtool.walletFunding.jeeber.*"
    timeout: 30000
- takeScreenshot: devtool_wallet_funding_jeeber_picker
- tapOn:
    id: "devtool.walletFunding.jeeber.*"
- extendedWaitUntil:
    visible:
      text: "Fund Jeeber wallet"
    timeout: 30000
- takeScreenshot: devtool_wallet_funding_before
- tapOn:
    id: "devtool.walletFunding.submit"
- extendedWaitUntil:
    visible:
      text: "Verified receipt"
    timeout: 120000
- assertVisible:
    text: "Verified receipt"
- assertVisible:
    text: "Before:.*USD"
- takeScreenshot: devtool_wallet_funding_verified_receipt
