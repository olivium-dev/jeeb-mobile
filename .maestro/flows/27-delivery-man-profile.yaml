# Jeeb mobile — 27 Delivery Man Profile (public profile / reviews).
# Figma node 56580:2697 (file ZOi3kKtw7sd42ssSVX3Kn4, flow profile-settings).
#
# WHAT THIS PROVES (migrated to canonical ids under JM-067 — 41_GUARDRAILS §1.1)
#   The delivery-man public profile renders (close-X navbar → avatar + verified
#   name + rating summary + location/availability → "Reviews" section with count
#   + "View all" + a list of review cards) with every interactive element
#   targeted BY SEMANTIC ID:
#     delivery_man_profile_screen_root      — screen host container (JM-067)
#     profile_close                         — _CloseButton (navbar X) (JM-067 AC)
#     profile_view_all_reviews              — _ViewAllButton → reviews-list (JM-067 AC)
#     profile_score                         — aggregate score (shown; fixture is 113 >= 5)
#     delivery_man_profile_review_card_0    — DeliveryReviewCard (first review)
#     delivery_man_profile_review_card_1    — DeliveryReviewCard (second review)
#   Non-interactive but assert-worthy:
#     delivery_man_profile_name, delivery_man_profile_availability.
#
# PRIMARY INTERACTION
#   "View all" is the screen's primary affordance. Under JM-067 it is now WIRED
#   to the reviews-list route (JM-068), so the tap lands on `reviews_list_root`
#   (the integrator's compiling stub renders that root). The close (X) is also
#   asserted present (modal-dismiss affordance).
#
# BACKEND / SEAM
#   Dev seam: jeeb.route=/profile/delivery-man → AppRouter lands directly on
#   DeliveryManProfileScreen with the deterministic
#   DevDeliveryManProfileFixtures (Kamal Hajj, 4.3 / 113 reviews, 2 visible
#   cards). No live gateway. UI parity only (UI-GUARDRAILS §6). Seam knobs via
#   launchApp.arguments (Android intent extras, release-inert —
#   dev-seam-runtime.md).
#
# MAESTRO 2.x: extendedWaitUntil for timed waits (2.0.5 rejects inline
#   assertVisible:{timeout}); waitForAnimationToEnd before screenshots; no fixed
#   sleeps; no coordinate taps; id-based assertions only.
#
# Run:
#   maestro --device NONE-DEVICE-FREE test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/27-delivery-man-profile.yaml
appId: ${APP_ID}
---
- launchApp:
    arguments:
      jeeb.route: "/profile/delivery-man"

# Identity header + reviews section — waited+asserted by id (cold launch).
- extendedWaitUntil:
    visible:
      id: "delivery_man_profile_screen_root"
    timeout: 25000
- assertVisible:
    id: "delivery_man_profile_name"
- assertVisible:
    id: "profile_close"
- assertVisible:
    id: "profile_score"
- assertVisible:
    id: "delivery_man_profile_availability"
- assertVisible:
    id: "profile_view_all_reviews"
- assertVisible:
    id: "delivery_man_profile_review_card_0"
- assertVisible:
    id: "delivery_man_profile_review_card_1"

- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 27_delivery_man_profile

# PRIMARY INTERACTION: tap View all → reviews-list (JM-067 → JM-068, WIRED).
- tapOn:
    id: "profile_view_all_reviews"
- extendedWaitUntil:
    visible:
      id: "reviews_list_root"
    timeout: 15000
