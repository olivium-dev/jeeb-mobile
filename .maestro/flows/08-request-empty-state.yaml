# Jeeb mobile — customer Requests empty state.
#
# Contract pinned by semantic id:
#   _request_empty_state_root               — Pending-list empty content
#   _request_empty_state_avatar             — greeting avatar
#   _request_empty_state_new_order_button   — "Create your first request" CTA
#   orders_create_request_button            — header top-plus entry
#   orders_filter_pendingRequests            — Pending Requests chip
#   orders_filter_replies                    — Replies chip
#   shell_tab_requests / delivery / profile  — client bottom navigation
#
# TIERS DEPENDENCY: the create tap opens the tier screen, so `GET /tiers` must
# answer with at least one tier carrying a server id — otherwise nothing is
# selectable and Continue never enables.
# Removed entry points stay absent: orders_home_new_order_fab,
# client_home_voice_request, and orders_search_bar.
#
# Run:
#   maestro test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/08-request-empty-state.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "_request_empty_state_root"
    timeout: 25000

- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08_request_empty_state_rendered

# Greeting, both approved create entries, and both Requests chips remain.
- assertVisible:
    id: "_request_empty_state_avatar"
- assertVisible:
    id: "_request_empty_state_new_order_button"
- assertVisible:
    id: "orders_create_request_button"
- assertVisible:
    id: "orders_filter_pendingRequests"
- assertVisible:
    id: "orders_filter_replies"

# FAB, search, and voice CTA were intentionally removed from this screen.
- assertNotVisible:
    id: "orders_home_new_order_fab"
- assertNotVisible:
    id: "orders_search_bar"
- assertNotVisible:
    id: "client_home_voice_request"

# Current shell navigation identifiers replace the legacy empty-state aliases.
- assertVisible:
    id: "shell_tab_requests"
- assertVisible:
    id: "shell_tab_delivery"
- assertVisible:
    id: "shell_tab_profile"

# The empty-state CTA is a real create-flow entry. SINGLE DOOR: it opens the
# tier screen, then Continue advances to location-select.
- tapOn:
    id: "_request_empty_state_new_order_button"
- extendedWaitUntil:
    visible:
      id: "request_type_continue_cta"
    timeout: 30000
- tapOn:
    id: "request_type_standard_radio"
- tapOn:
    id: "request_type_continue_cta"
- extendedWaitUntil:
    visible:
      id: "location_select_confirm_cta"
    timeout: 15000
# Two screens deep now — back out of location-select, then the tier screen.
- back
- extendedWaitUntil:
    visible:
      id: "request_type_continue_cta"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "_request_empty_state_root"
    timeout: 10000

# Prove the empty state is re-reachable through the shell.
- tapOn:
    id: "shell_tab_delivery"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "shell_tab_requests"
- extendedWaitUntil:
    visible:
      id: "_request_empty_state_root"
    timeout: 10000
- assertVisible:
    id: "_request_empty_state_new_order_button"
