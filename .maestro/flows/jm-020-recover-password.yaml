# ─────────────────────────────────────────────────────────────────────────────
# JM-020 — Recover Password (request code)
# ─────────────────────────────────────────────────────────────────────────────
# ACs covered:
#   AC1: Given recover_email_field filled, When recover_submit_cta tapped, Then
#        route to /recover/verify (verify_code_input visible) — code emailed [JM-021].
#   AC2: When recover_signup_link tapped → sign-up (signup_name_field visible).
#   AC3: When recover_back_to_signin_link tapped → /login (login_email_field visible).
#
# The /recover screen is reached from login via login_forgot_password_link (JM-007).
#
# Mock dependencies: request-recovery-code route (B3). RED until B3 lands.
# Governing decisions: D85.
#
# STATUS: RED until JM-020 ships (test-first)
#
# Run recipe:
#   export JAVA_HOME="$(/usr/libexec/java_home)"
#   ~/.maestro/bin/maestro --device emulator-5554 test \
#     -e APP_ID=app.jeeb.mobile.dev \
#     .maestro/flows/jm-020-recover-password.yaml
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
---

# ── Navigate to /recover via login screen ────────────────────────────────────
# Common setup used by all ACs in this flow.

# ── AC1: Email filled + submit → verify-code screen ──────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- takeScreenshot: jm020_ac0_recover_screen

- tapOn:
    id: "recover_email_field"
- inputText: "test@jeeb.app"

- tapOn:
    id: "recover_submit_cta"

- extendedWaitUntil:
    visible:
      id: "verify_code_input"
    timeout: 15000

- takeScreenshot: jm020_ac1_verify_code_screen_after_recover

# ── AC2: Sign-up link from recover → sign-up screen ──────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- tapOn:
    id: "recover_signup_link"

- extendedWaitUntil:
    visible:
      id: "signup_name_field"
    timeout: 15000

- takeScreenshot: jm020_ac2_signup_from_recover

# ── AC3: Back to sign-in link from recover → /login ──────────────────────────
- launchApp:
    clearState: true
    arguments:
      jeeb.seam.session: "logged_out_returning"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 30000

- tapOn:
    id: "login_forgot_password_link"

- extendedWaitUntil:
    visible:
      id: "recover_email_field"
    timeout: 15000

- tapOn:
    id: "recover_back_to_signin_link"

- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 15000

- takeScreenshot: jm020_ac3_login_from_recover_back
