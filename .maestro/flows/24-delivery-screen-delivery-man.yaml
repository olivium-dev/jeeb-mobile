# Jeeb mobile — 24 Delivery Screen [Delivery Man] (populated request feed).
# Figma node 56560:997 (registered jeeber, Requests chip, one incoming request).
#
# WHAT THIS PROVES
#   The deliveryman feed renders the incoming-request card (avatar + name +
#   rating + tier + items summary + distance + Ignore/Offer actions + 09:41
#   timestamp), every interactive element targeted BY SEMANTIC ID (verified in
#   source on feat/request-filter-ux-20260822):
#     jeeber_feed_filter_open                      — the filter disc trailing
#                                                    the stage strip
#                                                    jeeber_feed_tab_view.dart (_feedControls)
#     jeeber_feed_filter_sheet                     — the sheet it opens
#     jeeber_feed_search_field                     — the search input, now a
#                                                    facet INSIDE that sheet
#                                                    jeeber_feed_filter_sheet.dart (_FeedSearchField)
#     jeeber_feed_filter_apply                     — the sheet's commit CTA
#     jeeber_feed_request_card_dev-feed-incoming   — the request card
#                                                    jeeber_feed_card.dart (JeeberFeedCard)
#     jeeber_feed_request_ignore_dev-feed-incoming — Ignore action
#     jeeber_feed_request_offer_dev-feed-incoming  — Offer action
#                                                    jeeber_feed_card.dart (_IgnoreButton/_OfferButton)
#
# PRIMARY INTERACTION
#   "Ignore" dismisses the request from the feed. On the dev seam this is wired
#   to RequestFeedCubit.decline (jeeber_feed_tab_view.dart _FeedListView), which
#   removes the card and surfaces the Requests-empty state — a DETERMINISTIC,
#   assertible effect: after the tap the card id disappears. Real liveness +
#   nav-effect check, not an over-assertion of an unguaranteed target.
#
# BACKEND / SEAM
#   Dev seam: jeeb.route=/ + jeeb.feed=requests → seam forces the jeeber role,
#   DashboardTab seeds DevJeeberFeedFixtures.incoming() into a
#   SeededRequestFeedRepository (dashboard_tab.dart _DevFeedScaffold). No live
#   gateway. UI parity only (UI-GUARDRAILS §6). Seam knobs via
#   launchApp.arguments (Android intent extras, release-inert).
#
# MAESTRO 2.x: extendedWaitUntil for timed waits; waitForAnimationToEnd before
#   screenshots; no fixed sleeps; no coordinate taps; id-based assertions only.
#
# Run:
#   maestro --device NONE-DEVICE-FREE test -e APP_ID=app.jeeb.mobile.dev \
#     --format JUNIT --output <evidence>/maestro/junit.xml \
#     .maestro/flows/24-delivery-screen-delivery-man.yaml
appId: ${APP_ID}
---
- launchApp:
    arguments:
      jeeb.route: "/"
      jeeb.feed: "requests"

# Incoming request card — waited+asserted by id (cold launch + seeded load).
- extendedWaitUntil:
    visible:
      id: "jeeber_feed_request_card_dev-feed-incoming"
    timeout: 25000
# The magnifier disc and the always-on tier row are gone: search and tier are
# now staged facets of one filter sheet. Open it by id so the search field
# mounts, prove it is there, then commit an unchanged selection to close —
# nothing is staged, so the feed is left exactly as it was.
- tapOn:
    id: "jeeber_feed_filter_open"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "jeeber_feed_filter_sheet"
- assertVisible:
    id: "jeeber_feed_search_field"
- tapOn:
    id: "jeeber_feed_filter_apply"
- extendedWaitUntil:
    notVisible:
      id: "jeeber_feed_filter_sheet"
    timeout: 10000
- assertVisible:
    id: "jeeber_feed_request_offer_dev-feed-incoming"

- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 24_delivery_screen_delivery_man

# PRIMARY INTERACTION: Ignore dismisses the card from the feed.
- tapOn:
    id: "jeeber_feed_request_ignore_dev-feed-incoming"
- extendedWaitUntil:
    notVisible:
      id: "jeeber_feed_request_card_dev-feed-incoming"
    timeout: 10000
