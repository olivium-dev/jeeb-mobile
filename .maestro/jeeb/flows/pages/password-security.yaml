# PAGE OBJECT — Password & security
# ─────────────────────────────────────────────────────────────────────────────
# route: password-security (pushed with prev:"shell"). Reached by:
# Profile -> Password and security. A phone-only account can "Set a password".
#
# Coordinate fractions:
#   Current password:  50%,25%
#   New password:      50%,34%
#   Confirm password:  50%,42%
#   Save:              50%,51%
#   Set a password:    50%,60%
#
# Default action: none (capture) — this page mutates credentials, so all inputs
# are param-gated / left to explicit journeys.
#
# Params: APP_ID; SHOT.
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
env:
  APP_ID: app.jeeb.mobile
  SHOT: password-security
---
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${SHOT}"
