# PAGE OBJECT: location-permission — "Allow Jeeb to access this device's location?"
# Reached by: client-location on entry. Android SYSTEM UI -> text matchers work
# even without app semantics. Default: "While using the app" (grant), optional so
# it no-ops when the dialog is absent (already granted).
# Selectors: WhileUsing 50%,74.9% / OnlyThisTime 50%,81.2% / DontAllow 50%,87.5%.
---
- tapOn:
    text: "While using the app"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# Fallbacks:
# - tapOn: { text: "Only this time", optional: true }
# - tapOn: { point: "50%,74.9%" }   # coordinate fallback for "While using the app"
