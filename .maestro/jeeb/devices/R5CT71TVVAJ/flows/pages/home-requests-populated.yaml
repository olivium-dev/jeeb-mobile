# PAGE OBJECT: populated customer Requests screen.
# Primary action: use the semantic header plus to start request creation.
# Search, voice CTA, and the floating FAB are intentionally absent.
---
- assertVisible:
    id: "orders_create_request_button"
- assertVisible:
    id: "orders_filter_pendingRequests"
- assertVisible:
    id: "orders_filter_replies"
- assertNotVisible:
    id: "orders_search_bar"
- assertNotVisible:
    id: "client_home_voice_request"
- assertNotVisible:
    id: "orders_home_new_order_fab"

# Select Pending and pin that the populated request list is reachable by id.
- tapOn:
    id: "orders_filter_pendingRequests"
- assertVisible:
    id: "orders_home_request_row_0"

# Start the create flow through the only always-visible Requests entry point.
- tapOn:
    id: "orders_create_request_button"
- waitForAnimationToEnd:
    timeout: 4000
