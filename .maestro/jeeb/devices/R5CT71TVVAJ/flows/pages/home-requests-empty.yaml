# / H 854dp — re-measure from a screenshot if this device's inset differs.
- tapOn:
    point: "50%,83.6%"        # New Order -> request-type
- waitForAnimationToEnd:
    timeout: 4000
# A miss lands back on home with no assertable id, so this frame is the only
# evidence the tap connected.
- takeScreenshot: home-requests-empty-after-new-order
