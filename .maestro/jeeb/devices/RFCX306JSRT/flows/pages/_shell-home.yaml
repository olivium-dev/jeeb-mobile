# PAGE OBJECT — shell-home-requests / "Everything, One Place" (Requests tab, home)
# ─────────────────────────────────────────────────────────────────────────────
# route: shell. Reached by: Skip for now / Continue from profile-name.
# This is the authenticated home. Default action: start a New Order => route
# client-location, tier already seeded (S3). Bottom nav taps are exposed as
# params for the tour.
#
# Coordinate fractions of 1080x2340:
#   New Order:          50%,83.6%   (PINNED BAND — geometry, not content)
#     The capsule is no longer laid out by the scroll body: it is pinned at
#     bottom = scrollBodyBottomInset + 28 and is 48dp tall, so its band is
#     [1-(inset+76)/H , 1-(inset+28)/H] and its centre is 1-(inset+52)/H.
#     `inset` is the floating pill nav's painted height PLUS the system nav
#     inset (shell_screen.dart `_NavBarContentInset`). 83.6% is that centre for
#     inset 88dp / H 854dp — RE-MEASURE from a screenshot on any device whose
#     bottom inset differs by more than ~20dp, or the tap lands on the list.
#   FAB (+):          88%,74%
#   wallet icon:      78%,8%
#   notification bell:91%,8%
#   avatar / help:    7%,8%
#   nav Requests:     10%,92%
#   nav Delivery:     31%,92%
#   nav Dashboard:    52%,92%
#   nav Earnings:     73%,92%
#   nav Profile:      91%,92%
#
# Params:
#   ACTION (optional) — "new_order" (default) taps New Order; "none" just captures.
#   SHOT (optional)   — screenshot basename; default shell-home.
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
env:
  APP_ID: app.jeeb.mobile
  SHOT: shell-home
---
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "${SHOT}"
# Default: begin a new order.
- tapOn:
    point: "50%,83.6%"        # pinned band — see the formula above
- waitForAnimationToEnd:
    timeout: 5000
# A miss lands back on home with no assertable id (semantics are unreliable in
# prod on this device), so this frame is the only evidence the tap connected.
- takeScreenshot: "${SHOT}-after-new-order"
