# PAGE OBJECT — client-location / "What do you need?" (compose + location picker)
# ─────────────────────────────────────────────────────────────────────────────
# route: client-location. Reached by: Continue from request-type
#   => GET /api/users/me/saved-locations 200 (~1.6s slow call) + OS location dialog.
# Types the required description (Confirm stays disabled until non-empty), hides
# the keyboard, and Confirms => POST /v1/requests 201 => route waiting-no-coverage.
#
# Coordinate fractions of 1080x2340:
#   description text field:   50%,26%
#   voice mic button:         88%,25%
#   Current Location (row):   50%,51%   (pre-selected when location granted)
#   Saved addresses >:        31%,64%
#   New Location +:           88%,73%
#   Confirm location:         50%,87%
#
# Params:
#   DESC — delivery description text (required to enable Confirm).
#   SHOT (optional) — screenshot basename; default client-location.
# ─────────────────────────────────────────────────────────────────────────────
appId: ${APP_ID}
env:
  APP_ID: app.jeeb.mobile
  DESC: "Maestro automated test delivery"
  SHOT: client-location
---
- waitForAnimationToEnd:
    timeout: 4000
# Location OS dialog may pop on entry — dismiss optionally (system UI, text works).
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "${SHOT}"
- tapOn:
    point: "50%,26%"
- inputText: "${DESC}"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${SHOT}_filled"
- tapOn:
    point: "50%,87%"
- waitForAnimationToEnd:
    timeout: 6000
