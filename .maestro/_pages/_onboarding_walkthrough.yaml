appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "onboarding_next_button"
    timeout: 20000
- assertVisible:
    id: "onboarding_skip_button"
- tapOn:
    id: "onboarding_next_button"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "onboarding_next_button"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "onboarding_get_started_button"
    timeout: 10000
- tapOn:
    id: "onboarding_get_started_button"
- waitForAnimationToEnd:
    timeout: 5000
