# Parameters:
#   OTP_CODE - code to enter, e.g. 123456 or 000000.
#
# Expected app Semantics identifiers from checkpoint 008:
#   registration_otp_field
#   registration_verify_button
#
# Current blocker:
#   otp_verification_screen.dart currently uses Key('registration.otpField') and
#   Key('registration.verify'), not Semantics(identifier: ...).
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "registration_otp_field"
    timeout: 15000
- tapOn:
    id: "registration_otp_field"
- inputText: "${OTP_CODE}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "registration_verify_button"
    timeout: 10000
- tapOn:
    id: "registration_verify_button"
- waitForAnimationToEnd:
    timeout: 5000
