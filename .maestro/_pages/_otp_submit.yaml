# Parameters:
#   OTP_CODE - code to enter, e.g. 123456 or 000000.
#
# App Semantics identifiers:
#   registration_otp_field
#   registration_verify_button
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "registration_otp_field"
    timeout: 15000
- tapOn:
    id: "registration_otp_field"
- inputText: "${OTP_CODE}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "registration_verify_button"
    timeout: 10000
- tapOn:
    id: "registration_verify_button"
- waitForAnimationToEnd:
    timeout: 5000
