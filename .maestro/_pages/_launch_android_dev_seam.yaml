# Parameters:
#   LOCALE        - app locale language code, defaulted by parent flow.
#   JEEB_ROUTE    - route to pin through the runtime dev seam.
#   JEEB_HOME_TAB - optional client home tab seed.
#   JEEB_MOCK_BASE_URL - runtime mock REST base URL for this APK run.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    clearState: true
    arguments:
      jeeb.route: "${JEEB_ROUTE}"
      jeeb.locale: "${LOCALE}"
      jeeb.home_tab: "${JEEB_HOME_TAB}"
      jeeb.skip_onboarding: "true"
      jeeb.mock_base_url: "${JEEB_MOCK_BASE_URL}"
- waitForAnimationToEnd:
    timeout: 5000
